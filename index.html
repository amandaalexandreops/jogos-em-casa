<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E86AB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#BFE9FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icone-192.png">
<title>Jogos da Nina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* ============================================================
   MENU DOS JOGOS — a criança escolhe pelo desenho, sem ler.
   Feito para celular Android em pé; deitado vira 3 colunas.
   ============================================================ */
:root{
  color-scheme:light;
  --tinta:#3A2B52; --tinta-2:#6E5C90;
  --ceu-1:#BFE9FF; --ceu-2:#FFE3F2; --ceu-3:#FFF7DE;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:"Nunito",ui-rounded,system-ui,sans-serif;color:var(--tinta);
  background:var(--ceu-2);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:
    radial-gradient(120% 70% at 50% 110%, var(--ceu-3) 0%, transparent 60%),
    linear-gradient(178deg, var(--ceu-1) 0%, #DFF0FF 34%, var(--ceu-2) 78%, var(--ceu-3) 100%);
}
.nuvem{position:absolute;opacity:.8;pointer-events:none;animation:passeia 70s linear infinite}
.nuvem.b{animation-duration:96s;animation-delay:-40s;opacity:.55}
@keyframes passeia{from{transform:translateX(-40vw)}to{transform:translateX(130vw)}}

header{
  position:relative;z-index:2;display:flex;align-items:center;gap:10px;
  min-height:60px;flex:none;
}
h1{
  flex:1;font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;
  font-size:clamp(24px,7.4vw,38px);line-height:1;letter-spacing:-.01em;
  color:#fff;text-shadow:0 2px 0 #7A4CD1,0 5px 12px rgba(58,43,82,.28);
  -webkit-text-stroke:1.2px #7A4CD1;paint-order:stroke fill;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 2px;
}
.mini{
  flex:none;width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;background:#fff;
  box-shadow:0 5px 0 rgba(58,43,82,.14),0 10px 20px rgba(58,43,82,.16);
  transition:transform .12s;
}
.mini:active{transform:translateY(3px) scale(.96)}
#btAdulto{width:46px;height:46px;opacity:.75;position:relative;overflow:hidden}
#btAdulto .anel{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#9B6BF2 var(--p,0%),transparent 0);opacity:.35}

/* ---------- grade dos jogos ---------- */
main{
  position:relative;z-index:2;flex:1;min-height:0;
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);
  gap:clamp(8px,2.6vw,18px);padding:clamp(4px,1.6vh,14px) 0;
}
.jogo{
  position:relative;min-width:0;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:28px;
  transition:transform .14s cubic-bezier(.3,1.6,.5,1);
  animation:chega .5s cubic-bezier(.2,1.4,.4,1) both;
  animation-delay:calc(var(--i)*55ms);
}
@keyframes chega{from{opacity:0;transform:translateY(26px) scale(.86)}to{opacity:1;transform:none}}
.jogo:active{transform:scale(.93)}
.jogo.indo{transform:scale(1.08);transition-duration:.2s}
.jogo.falando .icone{animation:pula .5s ease-in-out infinite alternate}
.jogo.falando .rotulo{background:#fff;color:#7A4CD1}
@keyframes pula{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-9px) rotate(2deg)}}
.icone{
  flex:1;min-height:0;width:100%;display:grid;place-items:center;
  filter:drop-shadow(0 9px 10px rgba(58,43,82,.26));
}
.icone svg{height:100%;width:auto;max-width:100%;aspect-ratio:1}
.rotulo{
  flex:none;font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;
  font-size:clamp(15px,4.5vw,21px);line-height:1.1;color:var(--tinta);
  background:rgba(255,255,255,.72);border-radius:999px;padding:4px 14px 3px;
  box-shadow:0 2px 6px rgba(58,43,82,.1);white-space:nowrap;transition:background .2s,color .2s;
}
.selo{
  position:absolute;top:2%;right:6%;z-index:3;min-width:34px;height:34px;padding:0 8px;
  border-radius:999px;background:#FFC93C;color:#6B4A00;
  font:800 16px/34px "Baloo 2",system-ui,sans-serif;text-align:center;
  box-shadow:0 3px 0 #DEA612,0 6px 10px rgba(58,43,82,.2);
}

footer{
  position:relative;z-index:2;flex:none;display:flex;align-items:flex-end;gap:10px;min-height:66px;
}
#uni{width:74px;height:74px;flex:none;border-radius:50%;animation:flutua 3.4s ease-in-out infinite}
#uni:active{transform:scale(.92)}
@keyframes flutua{0%,100%{translate:0 0}50%{translate:0 -5px}}
#balao{
  flex:1;min-width:0;background:#fff;border-radius:22px 22px 22px 6px;padding:10px 16px;
  font-weight:800;font-size:clamp(14px,4vw,18px);line-height:1.25;
  box-shadow:0 6px 16px rgba(58,43,82,.14);margin-bottom:8px;
  transition:opacity .2s, transform .2s;
}
#balao.vazio{opacity:0;transform:translateY(6px)}

@media (orientation:landscape){
  main{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
  header{min-height:48px}
  .mini{width:48px;height:48px}
  #btAdulto{width:40px;height:40px}
  footer{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));right:auto;min-height:0}
  #uni{width:54px;height:54px}
  #balao{position:fixed;left:84px;bottom:10px;max-width:60vw;flex:none}
  h1{font-size:clamp(20px,6vh,30px)}
}
@media (prefers-reduced-motion:reduce){
  .jogo,.nuvem,#uni{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <svg class="nuvem" style="top:11%;width:150px" viewBox="0 0 200 90" aria-hidden="true"><g fill="#fff"><ellipse cx="60" cy="58" rx="46" ry="30"/><ellipse cx="106" cy="44" rx="38" ry="34"/><ellipse cx="146" cy="60" rx="34" ry="24"/></g></svg>
  <svg class="nuvem b" style="top:46%;width:110px" viewBox="0 0 200 90" aria-hidden="true"><g fill="#fff"><ellipse cx="60" cy="58" rx="46" ry="30"/><ellipse cx="106" cy="44" rx="38" ry="34"/><ellipse cx="146" cy="60" rx="34" ry="24"/></g></svg>

  <header>
    <h1 id="titulo">Jogos da Nina</h1>
    <button class="mini" id="btAdulto" aria-label="Área do adulto: segure para abrir">
      <span class="anel"></span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/></svg>
    </button>
  </header>

  <main id="grade"></main>

  <footer>
    <button id="uni" aria-label="Ouvir os nomes dos jogos"></button>
    <div id="balao" class="vazio"></div>
  </footer>
</div>

<script src="voz-pacote.js"></script>

/* cubo em perspectiva: tampa clara, frente e lado escurecendo */
function cubo(cx, cy, claro, medio, escuro, letra){
  const s = 44, a = s*.87;
  return `<g>
    <path d="M${cx},${cy-s} L${cx+a},${cy-s/2} L${cx},${cy} L${cx-a},${cy-s/2}z" fill="${claro}"/>
    <path d="M${cx-a},${cy-s/2} L${cx},${cy} L${cx},${cy+s} L${cx-a},${cy+s/2}z" fill="${medio}"/>
    <path d="M${cx},${cy} L${cx+a},${cy-s/2} L${cx+a},${cy+s/2} L${cx},${cy+s}z" fill="${escuro}"/>
    <path d="M${cx},${cy-s} L${cx+a},${cy-s/2} L${cx},${cy} L${cx-a},${cy-s/2}z" fill="#fff" opacity=".22"/>
    <path d="M${cx-a},${cy-s/2} L${cx},${cy} L${cx+a},${cy-s/2}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>
    <text transform="matrix(.87,.5,0,1,${cx-a},${cy-s/2})" x="${s/2}" y="${s*.82}" text-anchor="middle" font-family="Baloo 2, ui-rounded, system-ui, sans-serif" font-weight="800" font-size="38" fill="#fff">${letra}</text>
  </g>`;
}
/* bolinha de tinta com brilho */
function tinta(x, y, r, cor, escura){
  return `<ellipse cx="${x}" cy="${y+2}" rx="${r}" ry="${r*.82}" fill="${escura}"/>
    <ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.82}" fill="${cor}"/>
    <ellipse cx="${x-r*.3}" cy="${y-r*.3}" rx="${r*.36}" ry="${r*.2}" fill="#fff" opacity=".7"/>`;
}

/* estrelinhas: quanto ela já fez em cada jogo */
function selo(id){
  if(id === "emocoes"){ const n = (S.prog||[]).filter(p=>p>=1).length; return n ? n+"★" : ""; }
  if(id === "desenhar"){ const n = (le("desenhar-galeria",[])||[]).length; return n ? n+"★" : ""; }
  if(id === "ingles"){ const p = le("ingles-prog",{}); const n = Object.keys((p&&p.ilhas)||{}).filter(k=>p.ilhas[k]>=1).length; return n ? n+"★" : ""; }
  return "";
}

function mostraBalao(txt){
  const b = $("#balao");
  b.textContent = txt || "";
  b.classList.toggle("vazio", !txt);
}
Nina.aoFalar = mostraBalao;

function monta(){
  const nome = (S.nome||"Nina").trim();
  $("#titulo").textContent = "Jogos " + (/^[aeiouáéíóú]/i.test(nome) ? "de " : "da ") + nome;
  document.title = $("#titulo").textContent;
  $("#grade").innerHTML = JOGOS.map((j,i)=>{
    const s = selo(j.id);
    return `<button class="jogo" data-i="${i}" style="--i:${i}" aria-label="${j.nome}">
      ${s ? `<span class="selo">${s}</span>` : ""}
      <span class="icone">${ICONES[j.id]}</span>
      <span class="rotulo">${j.nome}</span>
    </button>`;
  }).join("");
  $$("#grade .jogo").forEach(b=>b.addEventListener("click", ()=>abre(b)));
}
let indo = false;
function abre(b){
  if(indo) return; indo = true;
  const j = JOGOS[+b.dataset.i];
  calar(); SFX.pop();
  b.classList.add("indo");
  setTimeout(()=>{ location.href = j.arq; }, 170);
}
/* se ela voltar pelo botão do celular, o menu precisa destravar */
addEventListener("pageshow", ()=>{ indo = false; $$(".jogo.indo").forEach(b=>b.classList.remove("indo")); monta(); });

/* o unicórnio apresenta os jogos em voz alta, um por vez */
let rodada = 0;
async function apresenta(){
  const meu = ++rodada;
  const cards = $$("#grade .jogo");
  cards.forEach(c=>c.classList.remove("falando"));
  prepara(JOGOS.map(j=>j.fala));
  if(!await falar("Escolhe o jogo!")) return;
  for(let i=0;i<cards.length;i++){
    if(meu !== rodada) return;
    cards[i].classList.add("falando");
    const ok = await falar(JOGOS[i].fala);
    cards[i].classList.remove("falando");
    if(!ok) return;
    await espera(80);
  }
  mostraBalao("");
}

/* portão do adulto: segurar 1,2 s (um toque rápido só explica) */
let tGate = null, tAnel = null;
const bt = $("#btAdulto"), anel = bt.querySelector(".anel");
function soltaGate(){ clearTimeout(tGate); clearInterval(tAnel); tGate = null; anel.style.setProperty("--p","0%"); }
bt.addEventListener("pointerdown", ()=>{
  const t0 = Date.now();
  tAnel = setInterval(()=>anel.style.setProperty("--p", Math.min(100,(Date.now()-t0)/12)+"%"), 40);
  tGate = setTimeout(()=>{ soltaGate(); calar(); location.href = "1-vulcao-e-arcoiris.html#adulto"; }, 1200);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>bt.addEventListener(ev, ()=>{
  const curto = !!tGate; soltaGate();
  if(curto && ev === "pointerup"){ rodada++; falar("Segure o botãozinho para chamar um adulto."); }
}));

monta();
})();
