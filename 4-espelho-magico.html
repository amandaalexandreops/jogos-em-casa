<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E86AB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F3ECFF">
<title>O Espelho Mágico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* ============================================================
   O ESPELHO MÁGICO — jogo 4 da série
   Autoestima por modelagem e imitação (neurônios-espelho):
   ela vê, faz junto, e depois faz sozinha — no tempo dela.
   ============================================================ */
:root{
  --ceu-1:#EADCFF; --ceu-2:#F6EFFF; --ceu-3:#FFF6FB;
  --tinta:#3A2B52; --tinta-2:#6E5C90; --tinta-3:#A294BE;
  --nuvem:#FFFFFF; --creme:#FFFBF4;
  --ouro:#FFC93C; --ouro-esc:#E0A800;
  --c1:#FF5A6E; --c2:#FF9A3D; --c3:#FFC93C; --c4:#3FCB8E; --c5:#3FA9F5; --c6:#9B6BF2;
  --sombra:0 14px 34px rgba(58,43,82,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ceu-2);color:var(--tinta);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
.ceu{position:absolute;inset:0;z-index:0;
  background:radial-gradient(130% 80% at 50% 0%,#fff 0%,transparent 58%),
             linear-gradient(178deg,var(--ceu-1) 0%,var(--ceu-2) 46%,var(--ceu-3) 100%)}
.brilhos{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.6}
h1,h2{font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;line-height:1.05;text-wrap:balance}

.topo{position:relative;z-index:20;display:flex;align-items:center;gap:9px;padding:max(9px,env(safe-area-inset-top)) 14px 3px}
.mini{width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--nuvem);border-radius:50%;
  box-shadow:0 5px 0 rgba(58,43,82,.14),0 10px 20px rgba(58,43,82,.08);transition:transform .1s,box-shadow .1s}
.mini:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(58,43,82,.14)}
.mini[hidden]{display:none}
.espaco{flex:1}
/* o pote de tesouros vai enchendo */
.pote{position:relative;width:44px;height:52px;flex:none}
.pote .vidro{position:absolute;inset:0;border:3px solid rgba(58,43,82,.28);border-radius:8px 8px 14px 14px;background:rgba(255,255,255,.5);overflow:hidden}
.pote .cheio{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#FFC93C,#FF7EB6);transition:height .8s cubic-bezier(.2,.8,.3,1)}
.pote .tampa{position:absolute;top:-6px;left:4px;right:4px;height:9px;border-radius:5px;background:#C9873F}
.pote b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-size:15px;color:#fff;text-shadow:0 2px 3px rgba(58,43,82,.5)}

main{position:relative;z-index:10;flex:1;display:flex;min-height:0;padding:0 11px}
.tela{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:780px;margin:auto;gap:clamp(8px,1.8vh,16px);min-height:0}
.tela.on{display:flex;animation:entra .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.cartao{background:var(--nuvem);border-radius:32px;padding:clamp(12px,2.4vh,22px);box-shadow:var(--sombra);
  width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,16px)}

.tit-jogo{font-size:clamp(30px,8vw,60px);text-align:center;letter-spacing:-1px}
.tit-jogo .l1{display:block;color:var(--c6)}
.tit-jogo .l2{display:block;color:var(--ouro-esc)}
.sub{font-size:clamp(13.5px,3.3vw,17px);color:var(--tinta-2);text-align:center;max-width:34ch;line-height:1.45}
.pergunta{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(18px,4.4vw,28px);text-align:center;line-height:1.15}

.bt{--bg:var(--c6);--dark:#7A4CD1;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--bg);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(18px,4.4vw,26px);padding:15px 34px;border-radius:999px;
  box-shadow:0 8px 0 var(--dark),0 16px 26px rgba(58,43,82,.22);transition:transform .09s,box-shadow .09s}
.bt:active{transform:translateY(7px);box-shadow:0 1px 0 var(--dark)}
.bt.gigante{font-size:clamp(24px,6.4vw,38px);padding:21px 50px}
.bt.claro{--bg:#fff;--dark:rgba(58,43,82,.16);color:var(--tinta)}
.bt.pequeno{font-size:15px;padding:10px 20px}
.pulsa{animation:pulsa 1.7s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
.esperando{animation:pulsa 1.3s ease-in-out infinite}

/* ---------- mapa dos módulos ---------- */
.modulos{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,2.2vw,14px);width:100%}
.mod{position:relative;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:24px;
  color:#fff;background:var(--cor);text-align:left;
  box-shadow:0 8px 0 var(--esc),0 14px 24px rgba(58,43,82,.18);transition:transform .12s,box-shadow .12s}
.mod:active{transform:translateY(6px);box-shadow:0 2px 0 var(--esc)}
.mod .ic{width:clamp(40px,10vw,54px);flex:none;background:rgba(255,255,255,.92);border-radius:16px;padding:4px}
.mod b{font-family:"Baloo 2",sans-serif;font-size:clamp(14px,3.5vw,18px);display:block;line-height:1.05}
.mod small{font-size:clamp(10.5px,2.6vw,12.5px);opacity:.94;font-weight:800;display:block;margin-top:2px}
.mod .ok{position:absolute;top:5px;right:8px;font-size:15px}

/* ---------- ritual do espelho ---------- */
.ritual{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.passo{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;
  opacity:.36;transition:.3s;font-weight:800;font-size:clamp(10.5px,2.7vw,13px);color:var(--tinta)}
.passo.on{opacity:1;background:#fff;box-shadow:0 5px 0 rgba(58,43,82,.12);transform:scale(1.06)}
.passo.feito{opacity:.78}
.moldura{position:relative;width:min(196px,44vw);padding:9px;border-radius:32px;
  background:linear-gradient(135deg,#FFC93C,#FF7EB6,#9B6BF2,#3FA9F5);
  box-shadow:0 12px 28px rgba(58,43,82,.24)}
.moldura .dentro{background:#FFFDF8;border-radius:24px;padding:6px}
.moldura.brilha{animation:brilhaM 1.5s ease-in-out infinite}
@keyframes brilhaM{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15) saturate(1.15)}}
.fazGesto{animation:gestoAnim .7s cubic-bezier(.3,1.4,.4,1)}
@keyframes gestoAnim{0%{transform:scale(.86) translateY(8px)}60%{transform:scale(1.06)}100%{transform:none}}
.frase-espelho{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(19px,5.2vw,32px);
  color:var(--c6);text-align:center;line-height:1.14}
.gesto-dica{font-weight:800;color:var(--tinta-2);font-size:clamp(13px,3.3vw,17px);text-align:center;line-height:1.3}
.pensamento{background:#fff;border-radius:24px;padding:9px 17px;box-shadow:0 6px 0 rgba(58,43,82,.09);
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(16px,4vw,24px);color:var(--tinta-2);text-align:center}
.pensamento .ainda{color:var(--c6);opacity:0;transition:opacity .5s}
.pensamento .ainda.on{opacity:1}
.aindabt{position:relative;display:grid;place-items:center;width:min(160px,42vw);aspect-ratio:1}
.aindabt .txt{position:absolute;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(22px,6vw,36px);color:#fff;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.gira{animation:gira 9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- eu já sei fazer ---------- */
.conquistas{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.8vw,11px);width:100%}
.conq{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:20px;
  background:var(--creme);box-shadow:0 6px 0 rgba(58,43,82,.09);transition:.2s}
.conq svg{width:clamp(34px,9vw,50px);height:auto}
.conq span{font-size:clamp(9.5px,2.4vw,12px);font-weight:800;color:var(--tinta-2);text-align:center;line-height:1.1}
.conq.feita{background:#DFF7EA;box-shadow:0 6px 0 #9EDCC0;animation:comemora .55s}
@keyframes comemora{0%{transform:scale(1)}45%{transform:scale(1.16) rotate(-4deg)}100%{transform:scale(1)}}

/* ---------- nuvem chatinha ---------- */
.nuvem-ruim{position:relative;width:min(230px,58vw);transition:transform .5s,opacity .5s}
.nuvem-ruim.encolhe{transform:scale(.3) translateY(-30px);opacity:0}
.nuvem-ruim.cresce{transform:scale(1.12)}
.nuvem-ruim .diz{position:absolute;inset:0;display:grid;place-items:center;padding:14% 16% 22%;
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(13px,3.4vw,19px);color:#5A5170;text-align:center;line-height:1.15}
.escudos{display:flex;flex-direction:column;gap:8px;width:100%}
.escudo{display:flex;align-items:center;gap:11px;background:#fff;border:4px solid rgba(58,43,82,.09);
  border-radius:22px;padding:10px 14px;text-align:left;box-shadow:0 6px 0 rgba(58,43,82,.10);transition:.15s}
.escudo:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(58,43,82,.10)}
.escudo b{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(15px,3.9vw,20px);color:var(--tinta);flex:1}
.escudo .em{font-size:clamp(22px,5.6vw,30px)}
.escudo.certa{border-color:var(--c4);animation:comemora .6s}
.escudo.fraca{opacity:.42;animation:treme .4s}
@keyframes treme{0%,100%{transform:none}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}

/* ---------- pote de tesouros ---------- */
.tesouros{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tesouro{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 16px;
  box-shadow:0 5px 0 rgba(58,43,82,.10);font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(13px,3.4vw,17px);color:var(--c6);transition:.15s}
.tesouro:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(58,43,82,.10)}

.guia{position:relative;z-index:20;display:flex;align-items:flex-end;gap:8px;padding:4px 12px max(9px,env(safe-area-inset-bottom))}
.uni{width:clamp(58px,13.5vw,86px);flex:none;animation:flutua 3.4s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.balao{flex:1;min-height:48px;background:var(--nuvem);border-radius:22px 22px 22px 6px;padding:10px 14px;
  box-shadow:var(--sombra);display:flex;align-items:center;font-weight:800;font-size:clamp(13px,3.3vw,17.5px);line-height:1.28}
.balao.vazio{opacity:0}
.diploma{background:var(--creme);border:6px dashed var(--c6);border-radius:28px;padding:clamp(14px,3vh,26px) 20px;text-align:center;width:100%}
.diploma .grande{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(26px,7.4vw,50px);color:var(--c6);line-height:1.05}
.diploma .nomezao{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(20px,5.4vw,32px);color:var(--ouro-esc);margin-top:6px}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
@media (prefers-reduced-motion:reduce){ .uni,.pulsa,.gira,.brilhos{animation:none!important} *{transition-duration:.01ms!important} }
@media (max-height:620px){ .uni{width:54px} .balao{min-height:40px;padding:7px 11px} }
</style>
</head>
<body>
<div id="app">
  <div class="ceu"></div>
  <header class="topo">
    <button class="mini" id="btCasa" aria-label="Voltar" hidden>
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </button>
    <div class="espaco"></div>
    <div class="pote" id="pote" aria-label="pote de tesouros">
      <div class="vidro"><div class="cheio" id="poteCheio" style="height:0%"></div></div>
      <div class="tampa"></div><b id="poteN"></b>
    </div>
    <div class="espaco"></div>
    <button class="mini" id="btSom" hidden aria-label="voz"><svg width="1" height="1"><path class="ondas"/></svg></button>
    <button class="mini" id="btHub" aria-label="Mapa dos jogos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="4" width="7" height="7" rx="2"/><rect x="3" y="15" width="7" height="5" rx="2"/><rect x="14" y="15" width="7" height="5" rx="2"/></svg>
    </button>
  </header>
  <main>
    <section class="tela on" id="t-inicio">
      <div class="moldura brilha" style="width:min(170px,38vw)"><div class="dentro" id="capa"></div></div>
      <h1 class="tit-jogo"><span class="l1">O Espelho</span><span class="l2">Mágico</span></h1>
      <p class="sub" id="sub-inicio">Olha, fala junto e depois fala sozinha. Cada frase vira um tesouro no pote.</p>
      <button class="bt gigante pulsa" id="btJogar">JOGAR</button>
    </section>
    <section class="tela" id="t-mapa">
      <div class="cartao">
        <p class="pergunta">O que a gente vai fazer?</p>
        <div class="modulos" id="modulos"></div>
      </div>
    </section>
    <section class="tela" id="t-jogo"><div class="cartao" id="palco"></div></section>
    <section class="tela" id="t-festa"><div class="cartao" id="palco-festa"></div></section>
    <section class="tela" id="t-final"><div class="cartao" id="palco-final"></div></section>
  </main>
  <footer class="guia">
    <div class="uni" id="uni"></div>
    <div class="balao vazio" id="balao"><p id="fala"></p></div>
    <button class="mini" id="btRepetir" aria-label="Ouvir de novo" style="align-self:center">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </footer>
  <canvas id="fx"></canvas>
</div>
<script src="voz-pacote.js"></script>
<script>
(function(){
"use strict";
const PADRAO={nome:"Nina",vestido:"#FF5A6E",pele:"#F5C9A6",cabelo:"#3B2418",voz:true};
let S=Object.assign({},PADRAO);
let PROG=[0,0,0,0], TESOUROS=[];
try{
  const b=localStorage.getItem("vulcao-arcoiris");
  if(b){ const o=JSON.parse(b); ["nome","vestido","pele","cabelo","voz"].forEach(k=>{ if(o[k]!==undefined) S[k]=o[k]; }); }
  const q=localStorage.getItem("espelho-prog");
  if(q){ const a=JSON.parse(q); if(Array.isArray(a)&&a.length===4) PROG=a; }
  const t=localStorage.getItem("espelho-tesouros");
  if(t){ const a=JSON.parse(t); if(Array.isArray(a)) TESOUROS=a; }
}catch(e){}
function salvar(){
  try{
    localStorage.setItem("espelho-prog",JSON.stringify(PROG));
    localStorage.setItem("espelho-tesouros",JSON.stringify(TESOUROS));
  }catch(e){}
}
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const CORES=["#FF5A6E","#FF9A3D","#FFC93C","#3FCB8E","#3FA9F5","#9B6BF2"];
const reduzir=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sorteia=a=>a[(Math.random()*a.length)|0];
function embaralha(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
try{
  const b=localStorage.getItem("vulcao-arcoiris");
  const o=b?JSON.parse(b):{};
  if(!o.vozRestaurada){ o.voz=true; o.vozRestaurada=true;
    localStorage.setItem("vulcao-arcoiris",JSON.stringify(o)); S.voz=true; }
}catch(e){}
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function nota(f, t0, dur, tipo, vol, f2){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || "sine";
  o.frequency.setValueAtTime(f, ac.currentTime + t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol||.22, ac.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
}
function ruido(dur, vol, filtro){
  const ac = audio(); if(!ac) return null;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value = filtro||900;
  const g = ac.createGain(); g.gain.value = vol||.14;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(); return src;
}
const SFX = {
  toque(){ nota(660,0,.09,"triangle",.16); },
  acerto(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>nota(f,i*.075,.34,"triangle",.2)); },
  brilho(){ for(let i=0;i<7;i++) nota(900+Math.random()*1200, i*.045, .28, "sine", .09); },
  tentar(){ nota(392,0,.16,"sine",.16); nota(330,.13,.26,"sine",.14); },
  estrela(){ nota(1046,0,.16,"triangle",.16,2093); },
  nivel(){ [523,587,659,784,880,1046].forEach((f,i)=>nota(f,i*.09,.42,"triangle",.19));
           setTimeout(()=>{for(let i=0;i<12;i++) nota(1200+Math.random()*1600,i*.05,.3,"sine",.07);},520); },
  fanfarra(){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>nota(f,i*.13,.55,"triangle",.2)); },
  inspira(){ nota(220,0,3.9,"sine",.10,520); },
  expira(){ nota(520,0,4.2,"sine",.10,180); ruido(2.2,.10,700); },
  pum(){ nota(120,0,.35,"sine",.2,60); },
  coracao(){ nota(150,0,.12,"sine",.25); nota(120,.18,.16,"sine",.22); }
};
let rumor = null, rumorG = null;
function rumorLiga(){
  const ac = audio(); if(!ac || rumor) return;
  const n = Math.floor(ac.sampleRate*2), buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  rumor = ac.createBufferSource(); rumor.buffer = buf; rumor.loop = true;
  const f = ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=170;
  rumorG = ac.createGain(); rumorG.gain.value=.0001;
  rumorG.gain.exponentialRampToValueAtTime(.3, ac.currentTime+1.2);
  rumor.connect(f); f.connect(rumorG); rumorG.connect(ac.destination); rumor.start();
}
function rumorDesliga(){
  if(!rumor) return;
  try{ rumorG.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+.8); rumor.stop(AC.currentTime+1); }catch(e){}
  rumor = null;
}


/* ---- TOCADOR DE VOZ GRAVADA -------------------------------------
   As falas foram gravadas em arquivo com a voz do próprio Mac
   (pasta "voz/"). Isso não depende da síntese do navegador, que
   estava muda aqui. Se faltar algum clipe, cai na voz do navegador.
   ------------------------------------------------------------------ */
let clipeAtual = null;
function temClipe(t){ return !!(window.VOZ && window.VOZ[t]); }
function tocaClipe(trecho, op){
  return new Promise(res=>{
    const nome = window.VOZ[trecho];
    const a = new Audio("voz/" + nome + ".m4a");
    let pronto = false;
    const fim = ()=>{ if(!pronto){ pronto = true; if(clipeAtual===a) clipeAtual=null; res(); } };
    a.onended = fim;
    a.onerror = fim;
    try{
      a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
      const r = (op && op.rate) ? op.rate/0.87 : 1;
      a.playbackRate = Math.max(.55, Math.min(1.5, r));
    }catch(e){}
    pararClipe();
    clipeAtual = a;
    const pr = a.play();
    if(pr && pr.catch) pr.catch(()=>fim());
    setTimeout(fim, 16000);
  });
}
function pararClipe(){
  if(clipeAtual){ try{ clipeAtual.pause(); clipeAtual.currentTime = 0; }catch(e){} clipeAtual = null; }
}

/* ---- DESTRAVA DA VOZ ------------------------------------------
   Safari e Chrome só liberam a síntese se speak() for chamado
   DENTRO do gesto do usuário, de forma síncrona. Por isso isto
   roda no primeiro pointerdown da página, antes de qualquer await.
   Texto curto e volume zero: silencioso, e sem travar a fila. --- */
let vozDestravada = false;
function destravaVoz(){
  if(vozDestravada || !("speechSynthesis" in window)) return;
  vozDestravada = true;
  try{
    const u = new SpeechSynthesisUtterance("oi");
    u.volume = 0; u.rate = 2; u.lang = "pt-BR";
    speechSynthesis.speak(u);
  }catch(e){}
  try{ speechSynthesis.getVoices(); }catch(e){}
  try{ const a=new Audio(); a.muted=true; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
document.addEventListener("pointerdown", destravaVoz, true);
document.addEventListener("keydown", destravaVoz, true);

/* se mesmo assim a voz não sair, o adulto precisa saber */
function avisaVozMuda(){
  if(document.getElementById("aviso-voz")) return;
  const d=document.createElement("div");
  d.id="aviso-voz";
  d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#FFF3F4;"+
    "border:3px solid #FF5A6E;border-radius:18px;padding:11px 14px;font:800 13px/1.35 Nunito,system-ui,sans-serif;"+
    "color:#3A2B52;box-shadow:0 10px 26px rgba(58,43,82,.25)";
  d.innerHTML='A voz do sistema não está respondendo neste navegador. '+
    'Abra <b>0-testar-voz.html</b> (mesma pasta) para verificar, ou tente abrir o jogo no Chrome. '+
    '<button style="margin-left:8px;border:0;background:#FF5A6E;color:#fff;border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer">ok</button>';
  d.querySelector("button").onclick=()=>d.remove();

/* --- motor de fala robusto ---------------------------------
   Três defesas: espera as vozes carregarem; se a fala não
   COMEÇAR, tenta de novo e depois desiste (em vez de travar o
   jogo esperando); e mantém o Chrome acordado, que corta a voz
   sozinho depois de alguns segundos.
   ----------------------------------------------------------- */
let vozPT = null, vozesOk = false, vozQuebrada = false, batida = null;
function pegaVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs || !vs.length) return;
  vozesOk = true;
  const br = vs.filter(v=>/pt[-_]BR/i.test(v.lang));
  const boa = /aprimorad|enhanced|premium|neural|natural|siri/i;
  /* ordem de preferência: Premium > vozes novas e expressivas > Luciana */
  const naturais = /^(Flo|Sandy|Shelley|Grandma)\b/i;
  vozPT = br.find(v=>boa.test(v.name))
       || br.find(v=>naturais.test(v.name))
       || br.find(v=>/Luciana|Joana|Francisca|Camila|Vit[oó]ria/i.test(v.name))
       || br[0]
       || vs.find(v=>/^pt/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){
  pegaVoz();
  speechSynthesis.onvoiceschanged = pegaVoz;
  /* Chrome interrompe a fala sozinho por volta dos 15 s */
  batida = setInterval(()=>{
    try{ if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  }, 5000);
}
async function esperaVozes(){
  if(vozesOk || !("speechSynthesis" in window)) return;
  for(let i=0;i<14 && !vozesOk;i++){ pegaVoz(); if(vozesOk) break; await espera(100); }
  vozesOk = true;
}

/* CAIXA ALTA sai robótica na síntese — só o balão mostra maiúscula */
function humaniza(t){
  return String(t)
    .replace(/\b[A-ZÁÂÃÀÉÊÍÓÔÕÚÜÇ]{2,}\b/g, m => m.charAt(0)+m.slice(1).toLowerCase())
    .replace(/\s+/g, " ").trim();
}
function pedacos(t){
  const bruto = []; let buf = "";
  for(const ch of t){ buf += ch; if(".!?…:;,".indexOf(ch) >= 0){ bruto.push(buf.trim()); buf = ""; } }
  if(buf.trim()) bruto.push(buf.trim());
  const j = [];
  for(const pe of bruto){
    if(j.length && j[j.length-1].length < 16) j[j.length-1] += " " + pe; else j.push(pe);
  }
  return j.length ? j : [t];
}
/* ---- O NOME DA CRIANÇA É UM CLIPE À PARTE ----------------------
   Assim o jogo serve a qualquer família: a fala é quebrada no nome
   e o nome vira um áudio separado, escolhido pelo cadastro. -------- */
function partesComNome(t){
  const nome=(S.nome||"").trim();
  if(!nome || t.indexOf(nome)<0) return pedacos(t);
  const saida=[];
  t.split(nome).forEach((frag,i)=>{
    if(i) saida.push(nome);
    frag=frag.trim().replace(/^[,;]\s*/,"");
    if(frag) pedacos(frag).forEach(c=>saida.push(c));
  });
  return saida.length?saida:pedacos(t);
}


let ultimaFala = "";
function mostraBalao(txt){
  ultimaFala = txt;
  const b = $("#balao");
  if(!b) return;
  $("#fala").textContent = txt;
  b.classList.toggle("vazio", !txt);
}

function novaFala(trecho, op){
  const u = new SpeechSynthesisUtterance(trecho);
  if(vozPT) u.voice = vozPT;
  u.lang  = "pt-BR";
  u.rate  = op.rate  || .87;
  u.pitch = op.pitch || 1.06;
  u.volume = 1;
  return u;
}
function dizNavegador(trecho, op){
  return new Promise(res=>{
    if(vozQuebrada) return setTimeout(res, Math.min(1600, 300+trecho.length*35));
    let pronto = false, comecou = false, tGuarda = null, tTeto = null;
    const fim = ()=>{
      if(pronto) return;
      pronto = true; clearTimeout(tGuarda); clearTimeout(tTeto); res();
    };
    const u = novaFala(trecho, op);
    u.onstart = ()=>{ comecou = true; };
    u.onend = fim; u.onerror = fim;
    /* não começou em 700 ms? limpa a fila e tenta uma segunda vez */
    tGuarda = setTimeout(()=>{
      if(comecou) return;
      try{ speechSynthesis.cancel(); }catch(e){}
      const u2 = novaFala(trecho, op);
      u2.onstart = ()=>{ comecou = true; };
      u2.onend = fim; u2.onerror = fim;
      try{ speechSynthesis.speak(u2); }catch(e){}
      /* nem na segunda? a voz não funciona aqui: segue sem travar o jogo */
      setTimeout(()=>{ if(!comecou){ vozQuebrada = true; avisaVozMuda(); fim(); } }, 1000);
    }, 700);
    tTeto = setTimeout(fim, 900 + trecho.length*95);
    try{ speechSynthesis.speak(u); }catch(e){ fim(); }
  });
}

function diz(trecho, op){
  op = op || {};
  if(temClipe(trecho)) return tocaClipe(trecho, op);
  return dizNavegador(trecho, op);
}

let falaId = 0;
async function falar(txt, opts){
  opts = opts || {};
  if(opts.balao !== false) mostraBalao(txt);
  const limpo = humaniza(txt);
  if(!S.voz || !("speechSynthesis" in window) || !limpo){
    await espera(opts.pausa === undefined ? 600 : opts.pausa);
    return;
  }
  const chunks = partesComNome(limpo);
  if(!chunks.every(temClipe)) await esperaVozes();
  const meu = ++falaId;
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      await espera(140);
    }
  }catch(e){}
  for(const trecho of chunks){
    if(meu !== falaId) return;
    await diz(trecho, opts);
    if(meu !== falaId) return;
    await espera(opts.gap === undefined ? 170 : opts.gap);
  }
  await espera(opts.pausa === undefined ? 420 : opts.pausa);
}
function calar(){ falaId++; pararClipe(); try{ speechSynthesis.cancel(); }catch(e){} }

const cv = $("#fx"), ctx = cv.getContext("2d");
let parts = [], animando = false;
function ajustaCanvas(){
  const d = Math.min(window.devicePixelRatio||1, 2);
  cv.width = innerWidth*d; cv.height = innerHeight*d;
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize", ajustaCanvas); ajustaCanvas();

function confete(n, x, y){
  if(reduzir) n = Math.min(n, 20);
  for(let i=0;i<n;i++){
    parts.push({
      x: x!==undefined ? x : Math.random()*innerWidth,
      y: y!==undefined ? y : -20 - Math.random()*innerHeight*.3,
      vx:(Math.random()-.5)*7, vy: y!==undefined ? -Math.random()*11-3 : Math.random()*2+1.5,
      g:.19, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.28,
      w:7+Math.random()*10, h:5+Math.random()*8,
      c: CORES[(Math.random()*CORES.length)|0], vida:1
    });
  }
  if(!animando){ animando = true; requestAnimationFrame(laco); }
}
function laco(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>{
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .995;
    if(p.y > innerHeight+40) return false;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.globalAlpha = .95;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    return true;
  });
  if(parts.length) requestAnimationFrame(laco);
  else { animando = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

const MODULOS=[

  ic:`<svg viewBox="0 0 60 60"><path d="M30,4 l7,17 18,1 -14,12 5,18 -16,-10 -16,10 5,-18 -14,-12 18,-1z" fill="#FFC93C" stroke="#DEA612" stroke-width="3" stroke-linejoin="round"/></svg>`},
 {nome:"O espelho", desc:"Falar junto", cor:"#9B6BF2", esc:"#7A4CD1",
  ic:`<svg viewBox="0 0 60 60"><ellipse cx="30" cy="28" rx="20" ry="24" fill="#EADCFF" stroke="#9B6BF2" stroke-width="4"/><path d="M20,16 q6,-4 12,0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="26" y="50" width="8" height="8" rx="3" fill="#9B6BF2"/></svg>`},
 {nome:"Eu já sei", desc:"O que eu consigo", cor:"#3FCB8E", esc:"#2AA372",
  ic:`<svg viewBox="0 0 60 60"><path d="M14,32 l10,10 22,-24" stroke="#3FCB8E" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`},
 {nome:"A nuvem chatinha", desc:"Responder pra ela", cor:"#3FA9F5", esc:"#2585C9",
  ic:`<svg viewBox="0 0 60 60"><ellipse cx="30" cy="26" rx="20" ry="13" fill="#8E8A9C"/><ellipse cx="18" cy="30" rx="11" ry="9" fill="#8E8A9C"/><ellipse cx="42" cy="30" rx="11" ry="9" fill="#8E8A9C"/><path d="M32,38 l-8,12h7l-4,10 14,-16h-8z" fill="#FFC93C"/></svg>`}
];

/* ==========================================================
   NAVEGAÇÃO
   ========================================================== */
let mod=0, idx=0, ocupado=false;
function tela(id){
  $$(".tela").forEach(t=>t.classList.remove("on"));
  $("#t-"+id).classList.add("on");
  $("#btCasa").hidden=(id==="inicio"||id==="mapa");
}
function pintaPote(){
  const n=TESOUROS.length, alvo=CORAGEM.length+AFIRMACOES.length+CONQUISTAS.length+NUVENS.length;
  $("#poteCheio").style.height=Math.min(100, n/alvo*100)+"%";
  $("#poteN").textContent=n||"";
}
function guardaTesouro(t){
  if(TESOUROS.indexOf(t)<0){ TESOUROS.push(t); salvar(); pintaPote(); }
}
function liberados(){ let n=1; for(let i=0;i<4;i++){ if(PROG[i]>=1) n=i+2; } return Math.min(n,4); }
function montaMapa(){
  const lib=liberados();
  $("#modulos").innerHTML=MODULOS.map((m,i)=>{
    const trava=i>=lib, feito=PROG[i]>=1;
    return `<button class="mod ${trava?"travada":""}" data-i="${i}"
      style="--cor:${trava?"#C8C3D4":m.cor};--esc:${trava?"#A9A5B8":m.esc}">
      ${feito?`<span class="ok">⭐</span>`:""}
      <span class="ic">${trava?`<svg viewBox="0 0 40 40"><rect x="10" y="18" width="20" height="15" rx="4" fill="#8E8A9C"/><path d="M15,18 v-4 a5,5 0 0110,0 v4" stroke="#8E8A9C" stroke-width="3.4" fill="none"/></svg>`:m.ic}</span>
      <span><b>${m.nome}</b><small>${m.desc}</small></span>
    </button>`;
  }).join("");
  $$("#modulos .mod").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i; SFX.toque(); calar();
    if(i>=liberados()) return falar("Esse ainda está fechado. Termina o de antes que ele abre!");
    abreModulo(i);
  }));
}
function irMapa(){
  calar(); montaMapa(); pintaPote(); tela("mapa");
  const f=PROG.filter(p=>p>=1).length;
  falar(f>=4 ? "Você já fez tudo! Pode brincar de novo no que quiser." : "O que a gente vai fazer?");
}
function abreModulo(i){
  mod=i; idx=0; PROG[i]=0; salvar(); tela("jogo");
  if(i===0 || i===1) telaAfirmacao();
  else if(i===2) telaConquistas();
  else telaNuvem();
}

/* ---------- MÓDULOS 1 e 2: o ritual do espelho ----------
   olha  ->  nós duas  ->  só você.  Fala curta: criança
   de cinco anos perde o fio em frase comprida. */
let ritual=0;
const listaAtual = ()=> (mod===0 ? CORAGEM : AFIRMACOES);

function telaAfirmacao(){
  const L=listaAtual();
  if(idx>=L.length) return festa();
  ritual=0; desenhaRitual();
}
function desenhaRitual(){
  const L=listaAtual(), a=L[idx];
  const passos=[["👀","Olha"],["🤝","Juntas"],["⭐","Só você"]];
  $("#palco").innerHTML=
    `<div class="ritual">${passos.map((pp,i)=>
       `<div class="passo ${i===ritual?"on":""} ${i<ritual?"feito":""}"><span>${pp[0]}</span>${pp[1]}</div>`).join("")}</div>
     ${(a.cena&&ritual===0)?`<p class="gesto-dica">${a.cena()}</p>`:""}
     <div class="moldura ${ritual>0?"brilha":""}"><div class="dentro" id="molduraFig">${boneca("alegria","",ritual===0?"normal":a.pose)}</div></div>
     <p class="frase-espelho">${a.f}</p>
     <p class="gesto-dica">${a.gesto}</p>
     <div id="acaoEsp"></div>
     <div style="display:flex;gap:6px">${L.map((_,i)=>
       `<svg style="width:22px" viewBox="0 0 100 100"><path d="M50,5 l12,29 31,2 -24,20 8,30 -27,-17 -27,17 8,-30 -24,-20 31,-2z" fill="${i<idx?CORES[i%6]:"rgba(58,43,82,.14)"}"/></svg>`).join("")}</div>`;
  rodaRitual();
}
function fazGesto(pose){
  const d=$("#molduraFig"); if(!d) return;
  d.innerHTML=boneca("alegria","",pose);
  d.classList.remove("fazGesto"); void d.offsetWidth; d.classList.add("fazGesto");
}
async function rodaRitual(){
  const a=listaAtual()[idx];
  ocupado=true;
  if(ritual===0){
    if(a.cena) await falar(a.cena());
    else await falar("Olha só a " + N() + ".");
    fazGesto(a.pose); SFX.brilho(); await espera(400);
    await falar(a.f,{rate:.78});
    botaoRitual("AGORA NÓS DUAS","#9B6BF2","#7A4CD1");
  } else if(ritual===1){
    fazGesto(a.pose);
    await falar("Agora nós duas juntas!");
    await espera(300);
    await falar(a.f,{rate:.6});
    botaoRitual("AGORA SÓ EU","#FF9A3D","#DB7620");
  } else {
    fazGesto(a.pose);
    await falar("Agora só você! Eu espero.");
    botaoRitual("EU FALEI!","#3FCB8E","#2AA372",true);
  }
  ocupado=false;
}
function botaoRitual(txt,bg,dark,esperando){
  const el=$("#acaoEsp"); if(!el) return;
  el.innerHTML=`<button class="bt ${esperando?"esperando":""}" id="btRit" style="--bg:${bg};--dark:${dark}">${txt}</button>`;
  $("#btRit").addEventListener("click",async ()=>{
    if(ocupado) return;
    SFX.toque();
    if(ritual<2){ ritual++; desenhaRitual(); return; }
    ocupado=true;
    SFX.estrela(); SFX.acerto(); confete(44,innerWidth/2,innerHeight*.55);
    await falar(sorteia(PARABENS));
    const L=listaAtual();
    guardaTesouro(L[idx].f);
    idx++; PROG[mod]=idx/L.length; salvar();
    ocupado=false; telaAfirmacao();
  });
}

/* ---------- MÓDULO 3: EU JÁ SEI FAZER ---------- */
async function telaConquistas(){
  const feitas=new Set();
  $("#palco").innerHTML=
    `<p class="pergunta">Aperta tudo o que você <b style="color:var(--c4)">já sabe</b> fazer!</p>
     <div class="conquistas" id="conqs">
       ${CONQUISTAS.map((c,i)=>`<button class="conq" data-i="${i}">
          ${typeof c.ic==="function"?c.ic():(c.ic||IC.letra())}<span>${c.nome}</span></button>`).join("")}
     </div>
     <div id="acaoConq"></div>`;
  $$("#conqs .conq").forEach(b=>b.addEventListener("click",async ()=>{
    const i=+b.dataset.i;
    if(feitas.has(i)) return;
    feitas.add(i);
    calar(); SFX.acerto(); SFX.brilho();
    b.classList.add("feita");
    confete(16,innerWidth/2,innerHeight*.5);
    const c=CONQUISTAS[i];
    const f=typeof c.fala==="function"?c.fala():c.fala;
    guardaTesouro(f);
    PROG[2]=feitas.size/CONQUISTAS.length; salvar();
    await falar(f,{rate:.85});
    if(feitas.size>=CONQUISTAS.length){
      await falar(`Olha quanta coisa você já sabe fazer, ${N()}! Tudo isso você não sabia antes e aprendeu.`);
      festa();
    }
  }));
  await falar("Agora o melhor de todos: a lista do que você JÁ sabe fazer.");
  await falar("Aperta cada figurinha e fala comigo: eu já sei!");
}

/* ---------- MÓDULO 4: A NUVEM CHATINHA ---------- */
function nuvemSVG(){
  return `<svg viewBox="0 0 240 150"><g fill="#9E99AE">
    <ellipse cx="120" cy="72" rx="82" ry="46"/><ellipse cx="62" cy="82" rx="46" ry="34"/>
    <ellipse cx="178" cy="82" rx="46" ry="34"/><ellipse cx="120" cy="46" rx="52" ry="34"/></g>
    <g fill="#3A2B52"><circle cx="96" cy="66" r="6"/><circle cx="144" cy="66" r="6"/></g>
    <path d="M100,96 q20,-12 40,0" stroke="#3A2B52" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="#5B8FD6" stroke-width="6" stroke-linecap="round" opacity=".8">
      <path d="M74,118 l-5,16"/><path d="M120,120 l-5,20"/><path d="M166,118 l-5,16"/></g></svg>`;
}
async function telaNuvem(){
  if(idx>=NUVENS.length) return festa();
  const n=NUVENS[idx];
  $("#palco").innerHTML=
    `<p class="pergunta">A nuvem chatinha voltou…</p>
     <div class="nuvem-ruim" id="nuvem">${nuvemSVG()}<div class="diz">${n.diz}</div></div>
     <p class="gesto-dica">O que você responde pra ela?</p>
     <div class="escudos" id="escudos">
       ${n.ops.map((o,i)=>`<button class="escudo" data-i="${i}"><span class="em">${o.em}</span><b>${o.t}</b></button>`).join("")}
     </div>`;
  $$("#escudos .escudo").forEach(b=>b.addEventListener("click",async ()=>{
    if(ocupado) return;
    const o=n.ops[+b.dataset.i];
    calar(); SFX.toque();
    if(o.ok){
      ocupado=true;
      b.classList.add("certa");
      await falar(o.t,{rate:.82});
      $("#nuvem").classList.add("encolhe");
      SFX.pum(); SFX.brilho(); confete(40,innerWidth/2,innerHeight*.45);
      await falar(n.depois);
      guardaTesouro(n.certa);
      idx++; PROG[3]=idx/NUVENS.length; salvar();
      ocupado=false; telaNuvem();
    } else {
      b.classList.add("fraca");
      const nv=$("#nuvem"); nv.classList.add("cresce");
      setTimeout(()=>nv.classList.remove("cresce"),600);
      SFX.tentar();
      falar("Hmm… a nuvem continua aí. Que tal falar uma coisa bem forte pra ela?");
    }
  }));
  ocupado=true;
  if(idx===0){
    await falar("Às vezes vem um pensamento chatinho, que fala coisa ruim pra gente.");
    await falar("Ele não manda em você. A gente pode responder!");
  }
  await falar(`A nuvem disse: ${n.diz}`,{rate:.8});
  await falar("O que você responde pra ela?");
  ocupado=false;
}

/* ==========================================================
   FESTA E O POTE
   ========================================================== */
const FESTA_FALA=[
 "Agora você tem quatro frases fortes pra usar quando ficar difícil!",
 "Você olhou, falou junto e falou sozinha. Essas frases agora são suas.",
 "Olha o tanto de coisa que você já sabe fazer!",
 "Você aprendeu a responder pro pensamento chatinho. Ele não manda em você."
];
async function festa(){
  PROG[mod]=1; salvar(); pintaPote();
  const i=mod;
  tela("festa"); SFX.nivel(); confete(90);
  $("#palco-festa").innerHTML=
    `<div class="moldura brilha" style="width:min(150px,36vw)"><div class="dentro">${boneca("alegria","","cima")}</div></div>
     <p class="pergunta" style="color:${MODULOS[i].cor}">Você conseguiu!</p>
     <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
       <button class="bt claro pequeno" id="btDeNovo">Fazer de novo</button>
       <button class="bt" id="btSeguir" style="--bg:${MODULOS[i].cor};--dark:${MODULOS[i].esc}">Continuar</button>
     </div>`;
  $("#btDeNovo").addEventListener("click",()=>{SFX.toque(); calar(); abreModulo(i);});
  $("#btSeguir").addEventListener("click",()=>{SFX.toque(); calar(); PROG.every(p=>p>=1)?oPote():irMapa();});
  await falar(FESTA_FALA[i]);
  if(PROG.every(p=>p>=1)) setTimeout(oPote,200);
}
async function oPote(){
  tela("final"); SFX.fanfarra(); confete(160);
  $("#palco-final").innerHTML=
    `<div class="diploma">
       <p style="font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--ouro-esc)">O POTE DE TESOUROS DE</p>
       <p class="nomezao">${S.nome}</p>
       <p class="grande" style="font-size:clamp(18px,4.4vw,26px);margin-top:8px;color:var(--tinta-2)">Aperta cada um para ouvir de novo</p>
     </div>
     <div class="tesouros" id="tesouros">
       ${TESOUROS.map((t,i)=>`<button class="tesouro" data-i="${i}">✨ ${t}</button>`).join("")}
     </div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
       <button class="bt claro pequeno" id="btVoltarMapa">Brincar de novo</button>
       <button class="bt pequeno" id="btHub4">Mapa dos jogos</button>
     </div>`;
  $$("#tesouros .tesouro").forEach(b=>b.addEventListener("click",()=>{
    calar(); SFX.estrela();
    falar(TESOUROS[+b.dataset.i],{rate:.85});
  }));
  $("#btVoltarMapa").addEventListener("click",()=>{SFX.toque(); calar(); irMapa();});
  $("#btHub4").addEventListener("click",paraHub);
  await falar(`Olha o seu pote, ${S.nome}! Cada frase aí dentro é sua.`);
  await falar("Quando você estiver tristinha, pode voltar aqui e ouvir todas de novo.");
}

/* ==========================================================
   CONTROLES
   ========================================================== */
const paraHub=()=>{ calar(); location.href="1-vulcao-e-arcoiris.html#hub"; };
$("#uni").innerHTML=unicornio();
$("#capa").innerHTML=boneca("alegria","","cima");
pintaPote();
if(TESOUROS.length) $("#sub-inicio").textContent=`Você já tem ${TESOUROS.length} tesouros no pote.`;
$("#btJogar").addEventListener("click",()=>{ audio(); SFX.brilho(); setTimeout(irMapa,120); });
$("#btCasa").addEventListener("click",()=>{SFX.toque(); calar(); irMapa();});
$("#btHub").addEventListener("click",paraHub);
$("#btRepetir").addEventListener("click",()=>{ if(ultimaFala) falar(ultimaFala); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) calar(); });
})();
</script>
