<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E86AB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<title>Qual É a Palavra?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* ============================================================
   QUAL É A PALAVRA?  —  jogo 3 da série
   Mecânica do jogo de tabuleiro: figura na carta, casinhas
   embaixo, e a criança monta a palavra letra por letra.
   6 níveis, dificuldade crescente. Voz gravada em arquivo.
   ============================================================ */
:root{
  --ceu-1:#FFE0A8; --ceu-2:#FFF1DC; --ceu-3:#FFFBF0;
  --tinta:#3A2B52; --tinta-2:#6E5C90; --tinta-3:#A294BE;
  --nuvem:#FFFFFF; --creme:#FFFBF4;
  --roxo:#8B5CC7; --roxo-esc:#6B3FA6;
  --c1:#FF5A6E; --c2:#FF9A3D; --c3:#FFC93C;
  --c4:#3FCB8E; --c5:#3FA9F5; --c6:#9B6BF2;
  --sombra:0 14px 34px rgba(58,43,82,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ceu-2);color:var(--tinta);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
.ceu{position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 70% at 50% 0%,#fff 0%,transparent 55%),
             linear-gradient(178deg,var(--ceu-1) 0%,var(--ceu-2) 45%,var(--ceu-3) 100%)}
h1,h2{font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;line-height:1.06;text-wrap:balance}

.topo{position:relative;z-index:20;display:flex;align-items:center;gap:9px;padding:max(9px,env(safe-area-inset-top)) 14px 3px}
.mini{width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--nuvem);border-radius:50%;
  box-shadow:0 5px 0 rgba(58,43,82,.14),0 10px 20px rgba(58,43,82,.08);transition:transform .1s,box-shadow .1s}
.mini:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(58,43,82,.14)}
.mini.off{opacity:.42}
.mini[hidden]{display:none}
.espaco{flex:1}
.letras{display:flex;gap:4px}
.letras b{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(15px,3.7vw,22px);
  width:1.4em;height:1.4em;display:grid;place-items:center;border-radius:9px;
  background:rgba(58,43,82,.09);color:rgba(58,43,82,.28);transition:.45s}
.letras b.on{background:var(--cor);color:#fff;transform:translateY(-3px) rotate(-3deg);box-shadow:0 4px 0 rgba(58,43,82,.15)}

main{position:relative;z-index:10;flex:1;display:flex;min-height:0;padding:0 10px}
.tela{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:820px;margin:auto;gap:clamp(7px,1.6vh,15px);min-height:0}
.tela.on{display:flex;animation:entra .4s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.cartao{background:var(--nuvem);border-radius:32px;padding:clamp(11px,2.2vh,20px);box-shadow:var(--sombra);
  width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,15px)}

.tit-jogo{font-size:clamp(30px,8vw,62px);text-align:center;letter-spacing:-1px}
.tit-jogo .l1{display:block;color:var(--c1)}
.tit-jogo .l2{display:block;color:var(--roxo)}
.sub{font-size:clamp(13.5px,3.3vw,17px);color:var(--tinta-2);text-align:center;max-width:34ch;line-height:1.45}
.pergunta{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(17px,4.2vw,26px);text-align:center;line-height:1.15}

.bt{--bg:var(--c2);--dark:#DB7620;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--bg);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(17px,4vw,24px);padding:14px 30px;border-radius:999px;
  box-shadow:0 8px 0 var(--dark),0 16px 26px rgba(58,43,82,.22);transition:transform .09s,box-shadow .09s}
.bt:active{transform:translateY(7px);box-shadow:0 1px 0 var(--dark)}
.bt.gigante{font-size:clamp(24px,6.4vw,38px);padding:21px 50px}
.bt.claro{--bg:#fff;--dark:rgba(58,43,82,.16);color:var(--tinta)}
.bt.pequeno{font-size:14.5px;padding:9px 17px}
.pulsa{animation:pulsa 1.7s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}

.carta{position:relative;background:#fff;border:7px solid var(--c1);border-radius:22px;padding:7px;
  width:min(178px,36vw);aspect-ratio:1;box-shadow:0 12px 0 rgba(58,43,82,.13),0 20px 34px rgba(58,43,82,.16);
  transform:rotate(-1.6deg);overflow:hidden}
.carta svg,.carta img{width:100%;height:100%;border-radius:15px;object-fit:contain;background:#FFFBF4;display:block}
.carta.pula{animation:pulinho .65s}
@keyframes pulinho{0%,100%{transform:rotate(-1.6deg)}35%{transform:rotate(2deg) translateY(-16px) scale(1.07)}}

.bandeja{display:flex;gap:clamp(4px,1.3vw,8px);justify-content:center;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--roxo),var(--roxo-esc));padding:clamp(8px,2vw,13px);border-radius:20px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.16),0 10px 24px rgba(58,43,82,.2)}
.casa{width:clamp(38px,9.5vw,60px);aspect-ratio:1;border-radius:11px;background:rgba(0,0,0,.22);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.3);display:grid;place-items:center;transition:.2s}
.casa.alvo{background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 4px #FFD23F;animation:pulsa 1.4s ease-in-out infinite}
.casa .peca{width:100%;height:100%;border-radius:11px;background:#FFFDF6;display:grid;place-items:center;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(21px,5.6vw,36px);line-height:1;
  box-shadow:0 4px 0 #D8CDBA;animation:encaixa .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes encaixa{0%{transform:scale(1.5) translateY(-24px);opacity:0}100%{transform:none;opacity:1}}

.cubos{display:flex;gap:clamp(5px,1.7vw,10px);justify-content:center;flex-wrap:wrap;width:100%}
.cubo{width:clamp(42px,10.5vw,64px);aspect-ratio:1;border-radius:13px;background:#FFFDF6;border:3px solid #EFE4D0;
  display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(22px,5.8vw,38px);line-height:1;
  box-shadow:0 7px 0 #D8CDBA,0 12px 18px rgba(58,43,82,.12);transition:transform .1s,box-shadow .1s,opacity .3s}
.cubo:active{transform:translateY(6px);box-shadow:0 1px 0 #D8CDBA}
.cubo.usado{opacity:0;pointer-events:none;transform:scale(.4)}
.cubo.apagado{opacity:.22;pointer-events:none;filter:grayscale(1)}
.cubo.errado{animation:nao .45s}
@keyframes nao{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-6deg)}60%{transform:translateX(9px) rotate(6deg)}}
.cubo.dica{animation:dica 1s ease-in-out infinite;border-color:#FFD23F}
@keyframes dica{0%,100%{transform:none;box-shadow:0 7px 0 #D8CDBA}50%{transform:translateY(-8px) scale(1.06);box-shadow:0 14px 0 #D8CDBA,0 0 0 5px rgba(255,210,63,.55)}}
.ferramentas{display:flex;gap:clamp(10px,3vw,18px);justify-content:center;align-items:center}
.fer{width:clamp(52px,13vw,66px);aspect-ratio:1;border-radius:50%;background:#fff;
  display:grid;place-items:center;font-size:clamp(24px,6vw,32px);line-height:1;
  box-shadow:0 6px 0 rgba(58,43,82,.13),0 12px 20px rgba(58,43,82,.10);
  transition:transform .1s,box-shadow .1s}
.fer:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(58,43,82,.13)}
.fer.dica-pisca{animation:pulsa 1.4s ease-in-out infinite}
.contador{font-weight:800;font-size:13px;color:var(--tinta-3);letter-spacing:.05em}

.niveis{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(7px,2vw,13px);width:100%}
.ilha{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 5px 8px;
  border-radius:22px;background:rgba(255,255,255,.75);box-shadow:0 6px 0 rgba(58,43,82,.09);
  transition:transform .12s,box-shadow .12s,filter .3s}
.ilha:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(58,43,82,.09)}
.bolha{width:clamp(46px,12vw,68px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(20px,5vw,28px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.13),0 8px 18px rgba(58,43,82,.2)}
.ilha .nome{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(11px,2.7vw,14px);text-align:center;line-height:1.1}
.ilha .comoe{font-size:clamp(9.5px,2.3vw,11.5px);color:var(--tinta-2);text-align:center;line-height:1.2}
.ilha.travada{filter:grayscale(.85) opacity(.55)}
.ilha.agora{animation:pulsa 2s ease-in-out infinite}
.selo{position:absolute;top:4px;right:7px;font-size:clamp(12px,3vw,17px)}

.guia{position:relative;z-index:20;display:flex;align-items:flex-end;gap:8px;padding:4px 12px max(9px,env(safe-area-inset-bottom))}
.uni{width:clamp(56px,13vw,82px);flex:none;animation:flutua 3.4s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
.balao{flex:1;min-height:46px;background:var(--nuvem);border-radius:22px 22px 22px 6px;padding:9px 13px;
  box-shadow:var(--sombra);display:flex;align-items:center;font-weight:800;font-size:clamp(13px,3.2vw,17px);line-height:1.28}
.balao.vazio{opacity:0}

.diploma{background:var(--creme);border:6px dashed var(--c2);border-radius:28px;padding:clamp(14px,3vh,26px) 20px;text-align:center;width:100%}
.diploma .grande{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(26px,7.4vw,50px);color:var(--c2);letter-spacing:5px;line-height:1}
.diploma .nomezao{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(20px,5.4vw,32px);color:var(--roxo);margin-top:6px}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
@media (prefers-reduced-motion:reduce){ .uni,.pulsa{animation:none!important} *{transition-duration:.01ms!important} }
@media (max-height:600px){ .uni{width:52px} .balao{min-height:38px;padding:6px 10px} }
</style>
</head>
<body>
<div id="app">
  <div class="ceu"></div>
  <header class="topo">
    <button class="mini" id="btCasa" aria-label="Voltar aos níveis" hidden>
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </button>
    <div class="espaco"></div>
    <div class="letras" id="letras"></div>
    <div class="espaco"></div>
    <button class="mini" id="btSom" hidden aria-label="Ligar ou desligar a voz">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#3A2B52"/><path class="ondas" d="M16.5 8.5a5 5 0 010 7M19.5 6a9 9 0 010 12"/></svg>
    </button>
    <button class="mini" id="btHub" aria-label="Mapa dos jogos">

    </button>
  </header>
  <main>
    <section class="tela on" id="t-inicio">
      <div class="carta" id="capa"></div>
      <h1 class="tit-jogo"><span class="l1">Qual É</span><span class="l2">a Palavra?</span></h1>
      <p class="sub" id="sub-inicio">Olha a figura e monta a palavra com as letrinhas!</p>
      <button class="bt gigante pulsa" id="btJogar">JOGAR</button>
    </section>
    <section class="tela" id="t-mapa">
      <div class="cartao">
        <p class="pergunta">Escolhe o nível</p>

  <footer class="guia">
    <div class="uni" id="uni"></div>
    <div class="balao vazio" id="balao"><p id="fala"></p></div>
    <button class="mini" id="btRepetir" aria-label="Ouvir de novo" style="align-self:center">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#3A2B52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </footer>
  <canvas id="fx"></canvas>
</div>
<script src="voz-pacote.js"></script>
<script>
(function(){
"use strict";
const PADRAO={nome:"Nina",vestido:"#FF5A6E",pele:"#F5C9A6",cabelo:"#3B2418",voz:true};
let S=Object.assign({},PADRAO);
let PROG=[0,0,0,0,0,0];
try{
  const b=localStorage.getItem("vulcao-arcoiris");
  if(b){ const o=JSON.parse(b); ["nome","vestido","pele","cabelo","voz"].forEach(k=>{ if(o[k]!==undefined) S[k]=o[k]; }); }
  const q=localStorage.getItem("palavras-prog");
  if(q){ const a=JSON.parse(q); if(Array.isArray(a)&&a.length===6) PROG=a; }
}catch(e){}
function salvar(){
  try{
    localStorage.setItem("palavras-prog",JSON.stringify(PROG));
    const b=localStorage.getItem("vulcao-arcoiris"); const o=b?JSON.parse(b):{};
    o.voz=S.voz; localStorage.setItem("vulcao-arcoiris",JSON.stringify(o));
  }catch(e){}
}
const $=s=>document.querySelector(s);

/* A criança desligava a voz sem querer no botão da barra. O botão saiu
   daqui (foi para a área do adulto) e a voz volta ligada uma única vez. */
try{
  const b=localStorage.getItem("vulcao-arcoiris");
  const o=b?JSON.parse(b):{};
  if(!o.vozRestaurada){ o.voz=true; o.vozRestaurada=true;
    localStorage.setItem("vulcao-arcoiris",JSON.stringify(o)); S.voz=true; }
}catch(e){}

const $$=s=>Array.from(document.querySelectorAll(s));
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const CORES=["#FF9A3D","#FFC93C","#3FCB8E","#9B6BF2"];
const ESCURO=["#DB7620","#DEA612","#2AA372","#7A4CD1"];
const LETRACOR=["#FF5A6E","#3FA9F5","#3FCB8E","#9B6BF2","#FF9A3D","#E8399B"];
const sorteia=a=>a[(Math.random()*a.length)|0];
function embaralha(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

let AC=null;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function nota(f,t0,dur,tipo,vol,f2){
  const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=tipo||"sine";
  o.frequency.setValueAtTime(f,ac.currentTime+t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+t0+dur);
  g.gain.setValueAtTime(.0001,ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol||.2,ac.currentTime+t0+.02);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+.05);
}
const SFX={
  toque(){ nota(660,0,.09,"triangle",.16); },
  encaixe(){ nota(523,0,.09,"square",.14); nota(880,.06,.22,"triangle",.18); },
  acerto(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>nota(f,i*.075,.34,"triangle",.2)); },
  brilho(){ for(let i=0;i<7;i++) nota(900+Math.random()*1200,i*.045,.28,"sine",.09); },
  tentar(){ nota(392,0,.16,"sine",.16); nota(330,.13,.26,"sine",.14); },
  nivel(){ [523,587,659,784,880,1046].forEach((f,i)=>nota(f,i*.09,.42,"triangle",.19));
           setTimeout(()=>{for(let i=0;i<12;i++) nota(1200+Math.random()*1600,i*.05,.3,"sine",.07);},520); },
  fanfarra(){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>nota(f,i*.13,.55,"triangle",.2)); }
};


/* ---- TOCADOR DE VOZ GRAVADA -------------------------------------
   As falas foram gravadas em arquivo com a voz do próprio Mac
   (pasta "voz/"). Isso não depende da síntese do navegador, que
   estava muda aqui. Se faltar algum clipe, cai na voz do navegador.
   ------------------------------------------------------------------ */
let clipeAtual = null;
function temClipe(t){ return !!(window.VOZ && window.VOZ[t]); }
function tocaClipe(trecho, op){
  return new Promise(res=>{
    const nome = window.VOZ[trecho];
    const a = new Audio("voz/" + nome + ".m4a");
    let pronto = false;
    const fim = ()=>{ if(!pronto){ pronto = true; if(clipeAtual===a) clipeAtual=null; res(); } };
    a.onended = fim;
    a.onerror = fim;
    try{
      a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
      const r = (op && op.rate) ? op.rate/0.87 : 1;
      a.playbackRate = Math.max(.55, Math.min(1.5, r));
    }catch(e){}
    pararClipe();
    clipeAtual = a;
    const pr = a.play();
    if(pr && pr.catch) pr.catch(()=>fim());
    setTimeout(fim, 16000);
  });
}
function pararClipe(){
  if(clipeAtual){ try{ clipeAtual.pause(); clipeAtual.currentTime = 0; }catch(e){} clipeAtual = null; }
}

/* ---- DESTRAVA DA VOZ ------------------------------------------
   Safari e Chrome só liberam a síntese se speak() for chamado
   DENTRO do gesto do usuário, de forma síncrona. Por isso isto
   roda no primeiro pointerdown da página, antes de qualquer await.
   Texto curto e volume zero: silencioso, e sem travar a fila. --- */
let vozDestravada = false;
function destravaVoz(){
  if(vozDestravada || !("speechSynthesis" in window)) return;
  vozDestravada = true;
  try{
    const u = new SpeechSynthesisUtterance("oi");
    u.volume = 0; u.rate = 2; u.lang = "pt-BR";
    speechSynthesis.speak(u);
  }catch(e){}
  try{ speechSynthesis.getVoices(); }catch(e){}
  try{ const a=new Audio(); a.muted=true; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
document.addEventListener("pointerdown", destravaVoz, true);
document.addEventListener("keydown", destravaVoz, true);

/* se mesmo assim a voz não sair, o adulto precisa saber */
function avisaVozMuda(){
  if(document.getElementById("aviso-voz")) return;
  const d=document.createElement("div");
  d.id="aviso-voz";
  d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#FFF3F4;"+
    "border:3px solid #FF5A6E;border-radius:18px;padding:11px 14px;font:800 13px/1.35 Nunito,system-ui,sans-serif;"+
    "color:#3A2B52;box-shadow:0 10px 26px rgba(58,43,82,.25)";
  d.innerHTML='A voz do sistema não está respondendo neste navegador. '+
    'Abra <b>0-testar-voz.html</b> (mesma pasta) para verificar, ou tente abrir o jogo no Chrome. '+
    '<button style="margin-left:8px;border:0;background:#FF5A6E;color:#fff;border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer">ok</button>';
  d.querySelector("button").onclick=()=>d.remove();
  document.body.appendChild(d);
}

/* --- motor de fala robusto ---------------------------------
   Três defesas: espera as vozes carregarem; se a fala não
   COMEÇAR, tenta de novo e depois desiste (em vez de travar o
   jogo esperando); e mantém o Chrome acordado, que corta a voz
   sozinho depois de alguns segundos.
   ----------------------------------------------------------- */
let vozPT = null, vozesOk = false, vozQuebrada = false, batida = null;
function pegaVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs || !vs.length) return;
  vozesOk = true;
  const br = vs.filter(v=>/pt[-_]BR/i.test(v.lang));
  const boa = /aprimorad|enhanced|premium|neural|natural|siri/i;
  /* ordem de preferência: Premium > vozes novas e expressivas > Luciana */
  const naturais = /^(Flo|Sandy|Shelley|Grandma)\b/i;
  vozPT = br.find(v=>boa.test(v.name))
       || br.find(v=>naturais.test(v.name))
       || br.find(v=>/Luciana|Joana|Francisca|Camila|Vit[oó]ria/i.test(v.name))
       || br[0]
       || vs.find(v=>/^pt/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){
  pegaVoz();
  speechSynthesis.onvoiceschanged = pegaVoz;
  /* Chrome interrompe a fala sozinho por volta dos 15 s */
  batida = setInterval(()=>{
    try{ if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  }, 5000);
}
async function esperaVozes(){
  if(vozesOk || !("speechSynthesis" in window)) return;
  for(let i=0;i<14 && !vozesOk;i++){ pegaVoz(); if(vozesOk) break; await espera(100); }
  vozesOk = true;
}

/* CAIXA ALTA sai robótica na síntese — só o balão mostra maiúscula */
function humaniza(t){
  return String(t)
    .replace(/\b[A-ZÁÂÃÀÉÊÍÓÔÕÚÜÇ]{2,}\b/g, m => m.charAt(0)+m.slice(1).toLowerCase())
    .replace(/\s+/g, " ").trim();
}
function pedacos(t){
  const bruto = []; let buf = "";
  for(const ch of t){ buf += ch; if(".!?…:;,".indexOf(ch) >= 0){ bruto.push(buf.trim()); buf = ""; } }
  if(buf.trim()) bruto.push(buf.trim());
  const j = [];
  for(const pe of bruto){
    if(j.length && j[j.length-1].length < 16) j[j.length-1] += " " + pe; else j.push(pe);
  }
  return j.length ? j : [t];
}
/* ---- O NOME DA CRIANÇA É UM CLIPE À PARTE ----------------------
   Assim o jogo serve a qualquer família: a fala é quebrada no nome
   e o nome vira um áudio separado, escolhido pelo cadastro. -------- */
function partesComNome(t){
  const nome=(S.nome||"").trim();
  if(!nome || t.indexOf(nome)<0) return pedacos(t);
  const saida=[];
  t.split(nome).forEach((frag,i)=>{
    if(i) saida.push(nome);
    frag=frag.trim().replace(/^[,;]\s*/,"");
    if(frag) pedacos(frag).forEach(c=>saida.push(c));
  });
  return saida.length?saida:pedacos(t);
}


let ultimaFala = "";
function mostraBalao(txt){
  ultimaFala = txt;
  const b = $("#balao");
  if(!b) return;
  $("#fala").textContent = txt;
  b.classList.toggle("vazio", !txt);
}

function novaFala(trecho, op){
  const u = new SpeechSynthesisUtterance(trecho);
  if(vozPT) u.voice = vozPT;
  u.lang  = "pt-BR";
  u.rate  = op.rate  || .87;
  u.pitch = op.pitch || 1.06;
  u.volume = 1;
  return u;
}
function dizNavegador(trecho, op){
  return new Promise(res=>{
    if(vozQuebrada) return setTimeout(res, Math.min(1600, 300+trecho.length*35));
    let pronto = false, comecou = false, tGuarda = null, tTeto = null;
    const fim = ()=>{
      if(pronto) return;
      pronto = true; clearTimeout(tGuarda); clearTimeout(tTeto); res();
    };
    const u = novaFala(trecho, op);
    u.onstart = ()=>{ comecou = true; };
    u.onend = fim; u.onerror = fim;
    /* não começou em 700 ms? limpa a fila e tenta uma segunda vez */
    tGuarda = setTimeout(()=>{
      if(comecou) return;
      try{ speechSynthesis.cancel(); }catch(e){}
      const u2 = novaFala(trecho, op);
      u2.onstart = ()=>{ comecou = true; };
      u2.onend = fim; u2.onerror = fim;
      try{ speechSynthesis.speak(u2); }catch(e){}
      /* nem na segunda? a voz não funciona aqui: segue sem travar o jogo */
      setTimeout(()=>{ if(!comecou){ vozQuebrada = true; avisaVozMuda(); fim(); } }, 1000);
    }, 700);
    tTeto = setTimeout(fim, 900 + trecho.length*95);
    try{ speechSynthesis.speak(u); }catch(e){ fim(); }
  });
}

function diz(trecho, op){
  op = op || {};
  if(temClipe(trecho)) return tocaClipe(trecho, op);
  return dizNavegador(trecho, op);
}

let falaId = 0;
async function falar(txt, opts){
  opts = opts || {};
  if(opts.balao !== false) mostraBalao(txt);
  const limpo = humaniza(txt);
  if(!S.voz || !("speechSynthesis" in window) || !limpo){
    await espera(opts.pausa === undefined ? 600 : opts.pausa);
    return;
  }
  const chunks = partesComNome(limpo);
  if(!chunks.every(temClipe)) await esperaVozes();
  const meu = ++falaId;
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      await espera(140);
    }
  }catch(e){}
  for(const trecho of chunks){
    if(meu !== falaId) return;
    await diz(trecho, opts);
    if(meu !== falaId) return;
    await espera(opts.gap === undefined ? 170 : opts.gap);
  }
  await espera(opts.pausa === undefined ? 420 : opts.pausa);
}
function calar(){ falaId++; pararClipe(); try{ speechSynthesis.cancel(); }catch(e){} }

const cvf=$("#fx"), cx2=cvf.getContext("2d");
let parts=[],animando=false;
function ajusta(){ const d=Math.min(devicePixelRatio||1,2); cvf.width=innerWidth*d; cvf.height=innerHeight*d; cx2.setTransform(d,0,0,d,0,0); }
addEventListener("resize",ajusta); ajusta();
const PALETA=["#FF5A6E","#FF9A3D","#FFC93C","#3FCB8E","#3FA9F5","#9B6BF2"];
function confete(n,x,y){
  for(let i=0;i<n;i++) parts.push({
    x:x!==undefined?x:Math.random()*innerWidth, y:y!==undefined?y:-20-Math.random()*innerHeight*.3,
    vx:(Math.random()-.5)*7, vy:y!==undefined?-Math.random()*11-3:Math.random()*2+1.5,
    g:.19,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.28,
    w:7+Math.random()*10,h:5+Math.random()*8,c:sorteia(PALETA)});
  if(!animando){ animando=true; requestAnimationFrame(laco); }
}
function laco(){
  cx2.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    if(p.y>innerHeight+40) return false;
    cx2.save(); cx2.translate(p.x,p.y); cx2.rotate(p.r);
    cx2.fillStyle=p.c; cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx2.restore();
    return true;
  });
  if(parts.length) requestAnimationFrame(laco);
  else { animando=false; cx2.clearRect(0,0,innerWidth,innerHeight); }
}


/* diz a palavra letra por letra */
async function soletra(p){
  for(const l of p.split("")){ await diz(l,{rate:.7}); await espera(190); }
}

/* ==========================================================
   4. AS PALAVRAS
   Foto (banco CC0) quando existe; senão, desenho.
   Você pode trocar qualquer figura: basta pôr um arquivo
   imagens/PALAVRA.jpg — uma foto do gato de casa vale mais
   que qualquer foto de banco de imagem.
   ========================================================== */
const COM_FOTO = ["BOLO","CARRO","CAVALO","CENOURA","GALO","GATO","GIRAFA","LIVRO","MACACO",
  "OVO","PRATO","ROSA","SUCO","TESOURA","TOMATE"];
const ARTIGO = {SOL:"um",MAR:"o",RIO:"um",LUA:"a",OVO:"um",BOLA:"uma",PATO:"um",CASA:"uma",
  PIPA:"uma",VACA:"uma",RATO:"um",MALA:"uma",FLOR:"uma",SINO:"um",MESA:"uma",TREM:"um",
  BOLO:"um",GALO:"um",GATO:"um",MOTO:"uma",ROSA:"uma",SAPO:"um",SUCO:"um",URSO:"um",
  LIVRO:"um",PEIXE:"um",NUVEM:"uma",CARRO:"um",CHAVE:"uma",PORTA:"uma",PRATO:"um",NAVIO:"um",
  SAPATO:"um",ABELHA:"uma",BANANA:"uma",CAVALO:"um",COELHO:"um",GIRAFA:"uma",JANELA:"uma",
  MACACO:"um",PANELA:"uma",TOMATE:"um",FOGUETE:"um",CASTELO:"um",CADEIRA:"uma",
  CENOURA:"uma",TESOURA:"uma"};
function figura(p){
  return COM_FOTO.indexOf(p) >= 0
    ? `<img src="imagens/${p}.jpg" alt="">`
    : (DES[p] || DES.BOLA);
}

const POR_TAMANHO = {};
Object.keys(ARTIGO).forEach(p=>{ (POR_TAMANHO[p.length] = POR_TAMANHO[p.length] || []).push(p); });

const ALFA = "ABCDEFGHIJLMNOPRSTUVZ".split("");
/* ajuda: "nomeia" = a voz diz a letra que falta (ela só procura);
   "pisca" = a letra certa pula depois de 2 erros;
   "so-pedindo" = só se ela apertar a lâmpada. */
const NIVEIS = [
  {nome:"Primeiras\npalavras", como:"3 letras", tam:3, extras:0, n:5, ajuda:"nomeia"},
  {nome:"Palavras\nde quatro", como:"4 letras", tam:4, extras:0, n:5, ajuda:"nomeia"},
  {nome:"Letras a\nmais",      como:"4 letras + 2 sobrando", tam:4, extras:2, n:5, ajuda:"pisca"},
  {nome:"Palavras\nde cinco",  como:"5 letras + 2 sobrando", tam:5, extras:2, n:5, ajuda:"pisca"},
  {nome:"Palavras\ngrandes",   como:"6 letras + 3 sobrando", tam:6, extras:3, n:5, ajuda:"so-pedindo"},
  {nome:"Desafio\nfinal",      como:"7 letras + 4 sobrando", tam:7, extras:4, n:5, ajuda:"so-pedindo"}
];
const MARCO = "LETRAS";

/* ==========================================================
   5. NAVEGAÇÃO
   ========================================================== */
let nivel=0, indice=0, lista=[], travado=false;
let palavra="", pos=0, errosNaCasa=0, primeiraDoNivel=true;

function tela(id){
  $$(".tela").forEach(t=>t.classList.remove("on"));
  $("#t-"+id).classList.add("on");
  $("#btCasa").hidden = (id==="inicio"||id==="mapa");
}
function pintaMarco(){
  $("#letras").innerHTML = MARCO.split("").map((l,i)=>
    `<b class="${PROG[i]>=1?"on":""}" style="--cor:${CORES[i%CORES.length]}">${l}</b>`).join("");
}
function liberados(){ let n=1; for(let i=0;i<6;i++){ if(PROG[i]>=1) n=i+2; } return Math.min(n,6); }
function montaMapa(){
  const lib=liberados();
  $("#niveis").innerHTML = NIVEIS.map((v,i)=>{
    const trava=i>=lib, feito=PROG[i]>=1;
    return `<button class="ilha ${trava?"travada":""} ${(!trava&&!feito&&i===lib-1)?"agora":""}" data-n="${i}">
      ${feito?`<span class="selo">⭐</span>`:""}
      <div class="bolha" style="background:${CORES[i%CORES.length]}">${trava
        ? `<svg viewBox="0 0 40 40" style="width:48%"><rect x="10" y="18" width="20" height="15" rx="4" fill="#fff"/><path d="M15,18 v-4 a5,5 0 0110,0 v4" stroke="#fff" stroke-width="3.4" fill="none"/></svg>`
        : i+1}</div>
      <span class="nome">${v.nome.replace(/\n/g,"<br>")}</span>
      <span class="comoe">${v.como}</span>
    </button>`;
  }).join("");
  $$("#niveis .ilha").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.n; SFX.toque(); calar();
    if(i>=liberados()) return falar("Esse ainda está trancado. Termina o de antes que ele abre!");
    abreNivel(i);
  }));
}
function irMapa(){
  calar(); nivel=-1;
  montaMapa(); pintaMarco(); tela("mapa");
  const f=PROG.filter(p=>p>=1).length;
  falar(f===0 ? "Escolhe por onde começar!"
      : f>=6 ? "Você já fez todos! Pode brincar de novo no que quiser."
      : "Muito bem! Qual é o próximo?");
}
function abreNivel(i){
  nivel=i; indice=0; PROG[i]=0; salvar(); pintaMarco();
  const N=NIVEIS[i];
  const pool = (POR_TAMANHO[N.tam]||[]).slice();
  lista = embaralha(pool).slice(0, Math.min(N.n, pool.length));   /* sem repetir dentro do nível */
  primeiraDoNivel = true;
  tela("jogo");
  montaPalavra();
}

/* ==========================================================
   6. MONTAR A PALAVRA
   ========================================================== */
function montaPalavra(){
  if(indice>=lista.length) return festa();
  palavra=lista[indice]; pos=0; errosNaCasa=0; travado=false;
  const N=NIVEIS[nivel];
  const letras=palavra.split("");
  const fora=embaralha(ALFA.filter(l=>letras.indexOf(l)<0)).slice(0,N.extras);
  const cubos=embaralha(letras.concat(fora));

  $("#palco").innerHTML=`
    <p class="pergunta">Qual é a palavra?</p>
    <div class="carta" id="carta">${figura(palavra)}</div>
    <div class="bandeja" id="bandeja">
      ${letras.map((_,i)=>`<div class="casa ${i===0?"alvo":""}" data-i="${i}"></div>`).join("")}
    </div>
    <div class="cubos" id="cubos">
      ${cubos.map((l,i)=>`<button class="cubo" data-l="${l}" data-i="${i}" style="color:${LETRACOR[i%LETRACOR.length]}">${l}</button>`).join("")}
    </div>
    <div class="ferramentas">
      <button class="fer" id="btOuvir" aria-label="Ouvir de novo">🔊</button>
      <button class="fer" id="btDica" aria-label="Dica">💡</button>
      <button class="fer" id="btApagar" aria-label="Tirar a última letra">↩️</button>
    </div>
    <p class="contador">${indice+1} de ${lista.length}</p>`;

  $$("#cubos .cubo").forEach(b=>b.addEventListener("click",()=>tocaCubo(b)));
  $("#btOuvir").addEventListener("click",()=>{ SFX.toque(); calar(); apresenta(false); });
  $("#btDica").addEventListener("click",()=>{ SFX.toque(); calar(); daDica(true); });
  $("#btApagar").addEventListener("click",()=>{ SFX.toque(); calar(); apaga(); });
  apresenta(primeiraDoNivel);
  primeiraDoNivel=false;
}
async function apresenta(comInstrucao){
  if(comInstrucao) await falar("Olha a figura e monta a palavra com as letrinhas!");
  await falar(`Olha! É ${ARTIGO[palavra]} ${palavra}.`);
  await falar(`Vamos escrever ${palavra}.`);
  if(pos===0) pedeProxima();
}
function alvoAtual(){ return palavra[pos]; }
function marcaAlvo(){ $$("#bandeja .casa").forEach(c=>c.classList.toggle("alvo", +c.dataset.i===pos)); }
function limpaDicas(){ $$("#cubos .cubo").forEach(c=>c.classList.remove("dica")); }
/* a lâmpada pisca quando existe ajuda disponível */
function marcaLampada(){
  const b=$("#btDica"); if(!b) return;
  b.classList.toggle("dica-pisca", errosNaCasa>=2);
}

function tocaCubo(b){
  if(travado || b.classList.contains("usado") || b.classList.contains("apagado")) return;
  calar();
  const L=b.dataset.l;
  if(L===alvoAtual()){
    SFX.encaixe(); limpaDicas(); restauraApagados();
    b.classList.add("usado");
    const casa=$(`#bandeja .casa[data-i="${pos}"]`);
    casa.innerHTML=`<span class="peca" style="color:${b.style.color}">${L}</span>`;
    casa.classList.remove("alvo"); casa.dataset.cubo=b.dataset.i;
    pos++; errosNaCasa=0; marcaLampada();
    if(pos>=palavra.length) return completou();
    marcaAlvo();
    pedeProxima();
  } else {
    SFX.tentar();
    b.classList.add("errado");
    setTimeout(()=>b.classList.remove("errado"),480);
    /* a errada some desta casa: o campo de escolha vai encolhendo */
    b.classList.add("apagado");
    errosNaCasa++; marcaLampada();
    const ajuda=NIVEIS[nivel].ajuda;
    if(ajuda==="nomeia") falar(`Esse é o ${L}. A gente quer o ${alvoAtual()}.`);
    else falar(`Esse é o ${L}.`);
    if(ajuda==="pisca" && errosNaCasa>=2) daDica(false);
  }
}
/* pede a próxima letra de um jeito diferente conforme o nível */
function pedeProxima(){
  const ajuda=NIVEIS[nivel].ajuda;
  if(ajuda==="nomeia") falar(`Agora o ${alvoAtual()}.`);          /* ela só procura */
  else if(ajuda==="pisca") diz(palavra,{rate:.72});               /* ouve a palavra de novo */
}
function restauraApagados(){ $$("#cubos .cubo").forEach(c=>c.classList.remove("apagado")); }
function apaga(){
  if(travado || pos===0) return;
  pos--;
  const casa=$(`#bandeja .casa[data-i="${pos}"]`);
  const idc=casa.dataset.cubo;
  casa.innerHTML=""; delete casa.dataset.cubo;
  const cubo=$(`#cubos .cubo[data-i="${idc}"]`);
  if(cubo) cubo.classList.remove("usado");
  errosNaCasa=0; limpaDicas(); marcaAlvo();
  falar("Tirei. Pode tentar de novo!");
}
function daDica(falada){
  const L=alvoAtual();
  const c=$$("#cubos .cubo").find(x=>!x.classList.contains("usado") && x.dataset.l===L);
  if(c){ c.classList.remove("apagado"); c.classList.add("dica"); }
  if(falada) falar(`A próxima letra é o ${L}.`);
}

/* --- terminou a palavra: comemora rápido e já vai pra próxima --- */
async function completou(){
  travado=true;
  SFX.acerto(); confete(36, innerWidth/2, innerHeight*.45);
  $("#carta").classList.add("pula");
  $$("#bandeja .casa").forEach(c=>c.classList.remove("alvo"));
  /* a palavra inteira PRECISA ser ouvida — é o prêmio */
  await diz(palavra,{rate:.8});
  await espera(150);
  falar(indice%2 ? "Muito bem!" : "Isso!");
  indice++;
  PROG[nivel]=indice/lista.length; pintaMarco(); salvar();
  await espera(900);
  travado=false;
  montaPalavra();
}

/* ==========================================================
   7. FESTA E FINAL
   ========================================================== */
const FESTA_FALA=[
  "Você escreveu suas primeiras palavras! Cada letrinha no lugar certinho.",
  "Palavras de quatro letras agora! Seu olho já acha as letras rapidinho.",
  "Tinha letra sobrando pra confundir e você não caiu. Que atenção!",
  "Palavras de cinco letras! Isso já é palavra de gente grande.",
  "Palavras grandes, com três letras sobrando. E você escreveu todas!",
  "Esse era o mais difícil de todos, sem nenhuma ajuda. E você conseguiu!"
];
async function festa(){
  PROG[nivel]=1; salvar(); pintaMarco();
  const i=nivel;
  tela("festa"); SFX.nivel(); confete(90);
  $("#palco-festa").innerHTML=
    `<svg style="width:min(160px,40vw)" viewBox="0 0 200 200">
       <circle cx="100" cy="100" r="72" fill="${CORES[i%CORES.length]}"/>
       <circle cx="100" cy="100" r="58" fill="#fff" opacity=".22"/>
       <text x="100" y="128" font-family="Baloo 2, sans-serif" font-size="86" font-weight="800" fill="#fff" text-anchor="middle">${MARCO[i]}</text>
     </svg>
     <p class="pergunta" style="color:${CORES[i%CORES.length]}">Você conseguiu!</p>
     <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
       <button class="bt claro pequeno" id="btDeNovo">Jogar de novo</button>
       <button class="bt" id="btSeguir" style="--bg:${CORES[i%CORES.length]};--dark:${ESCURO[i%ESCURO.length]}">Continuar</button>
     </div>`;
  $("#btDeNovo").addEventListener("click",()=>{SFX.toque(); calar(); abreNivel(i);});
  $("#btSeguir").addEventListener("click",()=>{SFX.toque(); calar(); PROG.every(p=>p>=1)?final():irMapa();});
  await falar(FESTA_FALA[i]);
  await falar(`E você ganhou a letra ${MARCO[i]}!`);
  if(PROG.every(p=>p>=1)) setTimeout(final,200);
}
async function final(){
  tela("final"); SFX.fanfarra(); confete(160);
  $("#palco-final").innerHTML=
    `<div class="diploma">
       <p style="font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--c2)">SEIS NÍVEIS COMPLETOS</p>
       <p class="grande">L E T R A S</p>
       <p class="nomezao">${S.nome}</p>
     </div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
       <button class="bt claro pequeno" id="btVoltarMapa">Brincar de novo</button>
       <button class="bt pequeno" id="btHub4">Mapa dos jogos</button>
     </div>`;
  $("#btVoltarMapa").addEventListener("click",()=>{SFX.toque(); calar(); irMapa();});
  $("#btHub4").addEventListener("click",paraHub);
  await falar(`Olha lá em cima, ${S.nome}!`);
  await falar("Essas seis letras que você ganhou formam uma palavra.");
  await soletra("LETRAS");
  await falar("LETRAS! E agora você já sabe juntar todas elas.");
}

/* ==========================================================
   8. CONTROLES
   ========================================================== */
const paraHub=()=>{ calar(); location.href="1-vulcao-e-arcoiris.html#hub"; };
$("#uni").innerHTML=unicornio();
$("#capa").innerHTML=figura("GATO");
pintaMarco();
if(PROG.some(p=>p>0)) $("#sub-inicio").textContent="Continue de onde você parou.";
$("#btJogar").addEventListener("click",()=>{ audio(); SFX.brilho(); setTimeout(irMapa,120); });
$("#btCasa").addEventListener("click",()=>{SFX.toque(); calar(); irMapa();});
$("#btHub").addEventListener("click",paraHub);
$("#btRepetir").addEventListener("click",()=>{ if(ultimaFala) falar(ultimaFala); });
$("#btSom").addEventListener("click",()=>{
  S.voz=!S.voz; salvar(); calar();
  $("#btSom").classList.toggle("off",!S.voz);
  const o=$("#btSom").querySelector(".ondas"); if(o) o.style.opacity=S.voz?"1":"0";
  if(S.voz) falar("Voz ligada!");
});
$("#btSom").classList.toggle("off",!S.voz);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) calar(); });
})();
</script>
