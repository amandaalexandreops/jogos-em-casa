<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E86AB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#BFE9FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Jogo falado de regulação emocional e autoestima para crianças de 4 a 6 anos que ainda não leem.">
<style>
  :root{color-scheme:light}
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>O Vulcão e o Arco-Íris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- a fonte carrega sem segurar a tela: em rede lenta (ou sem rede) o jogo abre na hora com a fonte do aparelho -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap" media="print" onload="this.media='all'">

<style>
/* ============================================================
   O VULCÃO E O ARCO-ÍRIS
   Jogo de regulação emocional e autoestima — 4 a 6 anos
   Mundo visual único (céu de dia). Sem leitura: tudo falado.
   ============================================================ */

:root{
  --ceu-1:#BFE9FF; --ceu-2:#FFE3F2; --ceu-3:#FFF7DE;
  --tinta:#3A2B52; --tinta-2:#6E5C90; --tinta-3:#A294BE;
  --nuvem:#FFFFFF; --creme:#FFFBF4;
  --c1:#FF5A6E; --c2:#FF9A3D; --c3:#FFC93C;
  --c4:#3FCB8E; --c5:#3FA9F5; --c6:#9B6BF2;
  --rosa:#FF7EB6;
  --sombra:0 14px 34px rgba(58,43,82,.16);
  --r-g:34px; --r-m:22px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--ceu-2);
  color:var(--tinta);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
  /* nada de zoom nem de arrastar a página; só rolam as áreas que
     declaram pan-y (cartão quando não cabe, folha do adulto) */
  touch-action:none;
  overflow:hidden;overflow:clip;
}
input{user-select:text;-webkit-user-select:text}

/* ---------- céu + arco-íris de fundo (é a barra de progresso) ---------- */
.ceu{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(120% 80% at 50% 108%, var(--ceu-3) 0%, transparent 55%),
    linear-gradient(178deg, var(--ceu-1) 0%, #DFF0FF 32%, var(--ceu-2) 74%, var(--ceu-3) 100%);
}
.nuvem-bg{position:absolute;z-index:1;opacity:.85;animation:passeia 62s linear infinite}
.nuvem-bg.b{animation-duration:88s;animation-delay:-30s;opacity:.6}
.nuvem-bg.c{animation-duration:104s;animation-delay:-64s;opacity:.45}
@keyframes passeia{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

.arcoiris{
  position:absolute;z-index:2;left:50%;bottom:-24%;
  width:max(1180px,168vw);aspect-ratio:2/1.06;
  transform:translateX(-50%);
  pointer-events:none;
}
.faixa{fill:none;stroke-linecap:round;stroke-width:44;
  stroke:rgba(58,43,82,.065);
  transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.25,1);
}
.faixa-viva{opacity:0;transition:opacity .5s}
.faixa-viva.acesa{opacity:1}

/* ---------- topo ---------- */
.topo{
  position:relative;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left));
}
.mini{
  position:relative;z-index:20;
  width:56px;height:56px;flex:none;
  display:grid;place-items:center;
  background:var(--nuvem);border-radius:50%;
  box-shadow:0 5px 0 rgba(58,43,82,.14), 0 10px 20px rgba(58,43,82,.10);
  transition:transform .1s, box-shadow .1s;
}
.mini:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(58,43,82,.14)}
#btAdulto{touch-action:none}   /* segurar sem o dedo "virar rolagem" e cancelar */
.espaco{flex:1}
.trilha{display:flex;gap:7px;align-items:center}
.pt{width:15px;height:15px;border-radius:50%;background:rgba(58,43,82,.14);transition:.35s}
.pt.feita{transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,255,255,.75)}

/* ---------- palco ---------- */
main{position:relative;z-index:10;flex:1;display:flex;min-height:0;
  padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.tela{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;max-width:900px;margin:auto;gap:clamp(10px,2.2vh,20px);
  min-height:0;max-height:100%;
}
.tela.on{display:flex;animation:entra .24s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes entra{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

.cartao{
  background:var(--nuvem);border-radius:var(--r-g);
  padding:clamp(14px,2.6vh,26px);
  box-shadow:var(--sombra);
  width:100%;
  display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);
  min-height:0;
  /* rede de segurança: se um dia não couber (tela muito baixa), rola
     dentro do cartão em vez de ficar escondido atrás do rodapé */
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  scrollbar-width:none;
}
.cartao::-webkit-scrollbar{display:none}
.cartao > *{flex:none}
.cartao.tremendo{animation:treme .4s}
@keyframes treme{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

h1,h2,h3,.tit{font-family:"Baloo 2",ui-rounded,system-ui,sans-serif;font-weight:800;line-height:1.08;text-wrap:balance}
.tit-jogo{font-size:clamp(30px,7.4vw,62px);text-align:center;letter-spacing:-.5px}
.tit-jogo .l1{display:block;color:var(--c1)}
.tit-jogo .l2{display:block;color:var(--c6)}
.sub{font-size:clamp(14px,3.4vw,18px);color:var(--tinta-2);text-align:center;max-width:34ch;line-height:1.45}
.pergunta{
  font-family:"Baloo 2",sans-serif;font-weight:700;
  font-size:clamp(20px,5vw,32px);text-align:center;line-height:1.15;text-wrap:balance;
}
.pergunta em{font-style:normal;padding:0 .22em;border-radius:10px;color:#fff}

/* ---------- botões de brinquedo ---------- */
.bt{
  --bg:var(--c6); --dark:rgba(0,0,0,.22);
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--bg);color:#fff;
  font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(19px,4.4vw,26px);
  padding:16px 34px;border-radius:999px;min-height:60px;
  box-shadow:0 8px 0 var(--dark), 0 16px 26px rgba(58,43,82,.22);
  transition:transform .09s, box-shadow .09s, filter .15s;
}
.bt:active{transform:translateY(7px);box-shadow:0 1px 0 var(--dark)}
.bt:focus-visible,.mini:focus-visible,.op:focus-visible,.zona:focus-visible{outline:4px solid var(--c6);outline-offset:4px}
.bt.gigante{font-size:clamp(24px,6.4vw,38px);padding:22px 52px}
.bt.fantasma{background:#fff;color:var(--tinta);--dark:rgba(58,43,82,.16);box-shadow:0 7px 0 var(--dark)}
.pulsa{animation:pulsa 1.7s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}

/* ---------- grade de opções ---------- */
.ops{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(9px,2.2vw,18px);width:100%}
.op{
  position:relative;
  background:var(--creme);
  border:4px solid rgba(58,43,82,.09);
  border-radius:var(--r-m);
  padding:10px 10px 8px;
  width:clamp(108px,calc(50% - 6px),178px);   /* duas por linha no celular em pé */
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 7px 0 rgba(58,43,82,.10);
  transition:transform .12s, box-shadow .12s, border-color .2s, opacity .3s;
}
.op:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(58,43,82,.10)}
.op svg{width:100%;height:auto}
.op .rot{font-size:clamp(11px,2.6vw,14px);font-weight:800;color:var(--tinta-2);text-align:center;line-height:1.2}
.op.falando{border-color:var(--c3);transform:translateY(-6px) scale(1.04);box-shadow:0 12px 0 rgba(58,43,82,.10)}
.op.certa{border-color:var(--c4);animation:comemora .6s}
.op.errada{opacity:.4;animation:treme .4s}
@keyframes comemora{0%{transform:scale(1)}45%{transform:scale(1.14) rotate(-3deg)}100%{transform:scale(1)}}

/* ---------- guia (unicórnio + balão) ---------- */
.guia{
  position:relative;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:6px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
}
.uni{width:clamp(72px,17vw,104px);flex:none;animation:flutua 3.4s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
/* altura fixa (3 linhas): o balão crescia com frases compridas e
   empurrava o jogo para cima no meio da fala */
.balao{
  flex:1;min-width:0;
  font-weight:800;font-size:clamp(14px,3.5vw,19px);line-height:1.28;
  height:calc(3.84em + 20px);
  background:var(--nuvem);border-radius:22px 22px 22px 6px;
  padding:10px 15px;box-shadow:var(--sombra);
  display:flex;align-items:center;
  color:var(--tinta);
}
.balao p{max-width:60ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.balao.vazio{opacity:0;pointer-events:none}

/* ---------- mapa ---------- */
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px);width:100%}
.ilha{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 4px 8px;border-radius:26px;background:rgba(255,255,255,.62);
  box-shadow:0 6px 0 rgba(58,43,82,.09);
  transition:transform .12s, box-shadow .12s, filter .3s;
}
.ilha:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(58,43,82,.09)}
.bolha{
  width:clamp(62px,16vw,96px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.13), 0 8px 18px rgba(58,43,82,.2);
}
.bolha svg{width:62%;height:62%}
.ilha .nome{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(11px,2.7vw,15px);text-align:center;line-height:1.1;color:var(--tinta)}
.ilha.travada{filter:grayscale(.85) opacity(.55)}
.ilha.agora{animation:pulsa 2s ease-in-out infinite}
.ilha.nega{animation:treme .4s}
.selo{position:absolute;top:4px;right:8px;font-size:clamp(15px,3.6vw,22px)}

/* ---------- corpo (etapa 2) ---------- */
.corpo-wrap{position:relative;width:min(300px,68vw,42vh)}
.zona{position:absolute;border:0;background:rgba(255,255,255,.001);border-radius:50%}
.zona::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:5px dashed rgba(58,43,82,.28);
  animation:pisca 2.2s ease-in-out infinite;
}
@keyframes pisca{0%,100%{transform:scale(.94);opacity:.5}50%{transform:scale(1.05);opacity:.95}}
.zona.acertou::after{border:6px solid var(--c4);animation:none}

/* ---------- vulcão (etapa 3) ---------- */
.vulcao-cena{position:relative;width:min(360px,80vw,44vh)}
/* respiração: vulcão em cima, flor grande no meio e a vela ao lado */
.resp-linha{
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"v v v" ". f c";
  justify-items:center;align-items:center;gap:clamp(6px,1.6vh,14px) 8px;width:100%;
}
.resp-linha .mini-v{grid-area:v;width:min(190px,48vw,24vh)}
.resp-linha .flor-bt{grid-area:f}
.resp-linha .vela-box{grid-area:c;justify-self:start;width:min(64px,15vw)}
.boneca-calma{width:min(150px,34vw,18vh)}
.fig-ainda{width:min(150px,30vw,20vh)}
.capa-fig{width:min(150px,34vw,22vh);margin:0 auto}
.linha-festa{display:flex;gap:14px 10px;flex-wrap:wrap;justify-content:center}
.estrelinhas{display:flex;gap:7px}
.balanca{animation:balanca .16s linear infinite}
@keyframes balanca{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
#lava{transition:transform 1.5s cubic-bezier(.3,.9,.3,1)}
.flor-bt{
  position:relative;width:min(200px,52vw,30vh);aspect-ratio:1;
  display:grid;place-items:center;touch-action:none;
}
.anel{
  position:absolute;inset:14%;border-radius:50%;
  border:8px solid var(--c4);opacity:.55;
  transform:scale(.55);
}
.anel.inspira{transition:transform 4s linear, opacity 4s linear;transform:scale(1.32);opacity:.95}
.anel.expira{transition:transform 4.6s ease-out, opacity 4.6s ease-out;transform:scale(.5);opacity:.4}
.flor-svg{width:74%;transition:transform 4s linear}
.flor-svg.crescendo{transform:scale(1.3)}
.chama{transform-origin:50% 100%}
.chama.soprada{animation:sopra 1.6s forwards}
@keyframes sopra{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-42deg) scale(.85)}70%{transform:rotate(-64deg) scale(.4)}100%{transform:rotate(-70deg) scale(0);opacity:0}}
.contador{display:flex;gap:12px}
.gota{width:26px;height:26px;border-radius:50%;background:rgba(58,43,82,.14);transition:.4s}
.gota.on{background:var(--c4);transform:scale(1.18);box-shadow:0 0 0 4px rgba(63,203,142,.25)}

/* ---------- balões de fala (etapa 5) ---------- */
.op.fala-op{border-radius:26px 26px 26px 8px;background:#fff}
.op .frase{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(12px,2.9vw,16px);text-align:center;color:var(--tinta);line-height:1.15}

/* ---------- estrela AINDA (etapa 6) ---------- */
.aindabt{position:relative;display:grid;place-items:center;width:min(190px,44vw,26vh);aspect-ratio:1;
  overflow:hidden;border-radius:50%}   /* a estrela girando não pode criar rolagem no cartão */
.aindabt .txt{
  position:absolute;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:clamp(24px,6.6vw,40px);color:#fff;letter-spacing:1px;
  text-shadow:0 3px 0 rgba(0,0,0,.18);
}
.gira{animation:gira 9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.pensamento{
  background:#fff;border-radius:24px;padding:10px 18px;
  box-shadow:0 6px 0 rgba(58,43,82,.09);
  font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(17px,4.2vw,26px);
  color:var(--tinta-2);text-align:center;
}
.pensamento .ainda{color:var(--c6);opacity:0;transition:opacity .5s}
.pensamento .ainda.on{opacity:1}
.estrelas-espelho{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.est{width:clamp(56px,15vw,84px);aspect-ratio:1;display:grid;place-items:center;transition:.25s}
.est:active{transform:scale(.9)}
.est.usada{opacity:.3;pointer-events:none}

/* ---------- festa / final ---------- */
.medalha{width:min(220px,52vw,30vh)}
.diploma{
  background:var(--creme);border:6px dashed var(--c6);border-radius:28px;
  padding:clamp(16px,3.4vh,28px) 20px;text-align:center;width:100%;
}
.diploma .grande{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(28px,7.6vw,54px);color:var(--c1);line-height:1}
.diploma .nomezao{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(22px,6vw,40px);color:var(--c6);margin-top:6px}

#fx{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- overlays ---------- */
.ov{
  position:fixed;inset:0;z-index:80;
  background:rgba(40,28,60,.66);
  display:none;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.ov.on{display:flex;animation:entra .2s both}
.folha{
  background:var(--creme);border-radius:var(--r-g);
  width:100%;max-width:760px;max-height:100%;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;touch-action:pan-y;
  padding:clamp(20px,4vw,40px);
  box-shadow:0 30px 70px rgba(30,18,48,.4);
}
.fecha-x{
  position:sticky;top:0;float:right;z-index:2;
  width:56px;height:56px;margin:-6px -6px 0 8px;
  display:grid;place-items:center;border-radius:50%;
  background:#fff;box-shadow:0 4px 0 rgba(58,43,82,.14);
}
.folha-jogo{max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}

/* painel do adulto — tratamento editorial, para leitura */
.folha h2{font-size:clamp(26px,5.4vw,38px);color:var(--c6);letter-spacing:-.4px}
.folha .olho{
  font-family:"Nunito",sans-serif;font-weight:800;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--c1);
  margin-bottom:6px;
}
.folha h3{font-size:clamp(18px,4vw,23px);margin-top:26px;color:var(--tinta)}
.folha p,.folha li{font-size:clamp(14px,3.3vw,16.5px);line-height:1.62;color:#4A3A66;max-width:66ch}
.folha p{margin-top:10px}
.folha ul{margin:10px 0 0 20px;display:flex;flex-direction:column;gap:8px}
.folha hr{border:0;border-top:2px dotted rgba(58,43,82,.18);margin:26px 0}
.folha strong{color:var(--tinta)}
.etapa-doc{
  display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;
  padding:14px 0;border-bottom:2px dotted rgba(58,43,82,.14);
}
.etapa-doc .bola{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px}
.etapa-doc h4{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(16px,3.8vw,20px)}
.etapa-doc .base{font-size:clamp(12.5px,3vw,14px);color:var(--tinta-2);margin-top:4px;font-style:italic}
.aviso{background:#FFF3F4;border-left:6px solid var(--c1);border-radius:0 16px 16px 0;padding:14px 18px;margin-top:18px}
.aviso p{margin-top:0}

.ajustes{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.campo{display:flex;flex-direction:column;gap:7px}
.campo label{font-weight:800;font-size:14px;color:var(--tinta-2)}
.campo input[type=text]{
  font:inherit;font-weight:800;font-size:19px;padding:12px 16px;
  border:3px solid rgba(58,43,82,.16);border-radius:16px;background:#fff;color:var(--tinta);
}
.campo input:focus{outline:none;border-color:var(--c6)}
.paleta{display:flex;flex-wrap:wrap;gap:9px}
.swatch{width:48px;height:48px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.16);transition:.15s}
.swatch.sel{transform:scale(1.16);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c6)}
.linha-bt{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.bt.pequeno{font-size:16px;padding:12px 22px;min-height:56px}

/* ---------- etapa 6: ritual do espelho ---------- */
.ritual{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.passo{
  display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.65);
  border-radius:999px;padding:6px 13px;opacity:.38;transition:.3s;
  font-weight:800;font-size:clamp(10.5px,2.7vw,13.5px);color:var(--tinta);
}
.passo.on{opacity:1;background:#fff;box-shadow:0 5px 0 rgba(58,43,82,.12);transform:scale(1.06)}

<script>
(function(){
"use strict";

/* ==========================================================
   0. ESTADO E PERSISTÊNCIA
   ========================================================== */
const PADRAO = {
  nome:"Nina",
  vestido:"#FF5A6E",
  pele:"#F5C9A6",
  cabelo:"#3B2418",
  voz:true,
  prog:[0,0,0,0,0,0]     // fração 0..1 concluída por etapa
};
let S = Object.assign({}, PADRAO);

function salvar(){ try{ localStorage.setItem("vulcao-arcoiris", JSON.stringify(S)); }catch(e){} }
function carregar(){
  try{
    const b = localStorage.getItem("vulcao-arcoiris");
    if(b) S = Object.assign({}, PADRAO, JSON.parse(b));
  }catch(e){}
  if(!Array.isArray(S.prog) || S.prog.length!==6) S.prog=[0,0,0,0,0,0];
  S.prog = S.prog.map(p=>Math.max(0, Math.min(1, +p || 0)));
  if(typeof S.nome !== "string" || !S.nome.trim()) S.nome = PADRAO.nome;
}
carregar();

/* A criança desligava a voz sem querer no botão da barra. O botão saiu
   daqui (foi para a área do adulto) e a voz volta ligada uma única vez. */
try{
  const b=localStorage.getItem("vulcao-arcoiris");
  const o=b?JSON.parse(b):{};
  if(!o.vozRestaurada){ o.voz=true; o.vozRestaurada=true;
    localStorage.setItem("vulcao-arcoiris",JSON.stringify(o)); S.voz=true; }
  /* a marca precisa ir junto no S: sem isso o próximo salvar() apagava a
     marca e a voz voltava ligada a cada abertura, mesmo desligada pelo adulto */
  S.vozRestaurada = true;
}catch(e){}


const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const espera = ms => new Promise(r=>setTimeout(r,ms));
const CORES = ["#FF5A6E","#FF9A3D","#FFC93C","#3FCB8E","#3FA9F5","#9B6BF2"];
const ESCURO = ["#D93E52","#DB7620","#DEA612","#2AA372","#2585C9","#7A4CD1"];
const reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ==========================================================
   1. SOM — Web Audio (efeitos) + fala pt-BR
   ========================================================== */
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function nota(f, t0, dur, tipo, vol, f2){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || "sine";
  o.frequency.setValueAtTime(f, ac.currentTime + t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol||.22, ac.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
}
function ruido(dur, vol, filtro){
  const ac = audio(); if(!ac) return null;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value = filtro||900;
  const g = ac.createGain(); g.gain.value = vol||.14;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(); return src;
}
const SFX = {
  toque(){ nota(660,0,.09,"triangle",.16); },
  acerto(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>nota(f,i*.075,.34,"triangle",.2)); },
  brilho(){ for(let i=0;i<7;i++) nota(900+Math.random()*1200, i*.045, .28, "sine", .09); },
  tentar(){ nota(392,0,.16,"sine",.16); nota(330,.13,.26,"sine",.14); },
  estrela(){ nota(1046,0,.16,"triangle",.16,2093); },
  nivel(){ [523,587,659,784,880,1046].forEach((f,i)=>nota(f,i*.09,.42,"triangle",.19));
           setTimeout(()=>{for(let i=0;i<12;i++) nota(1200+Math.random()*1600,i*.05,.3,"sine",.07);},520); },
  fanfarra(){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>nota(f,i*.13,.55,"triangle",.2)); },
  inspira(){ nota(220,0,3.9,"sine",.10,520); },
  expira(){ nota(520,0,4.2,"sine",.10,180); ruido(2.2,.10,700); },
  pum(){ nota(120,0,.35,"sine",.2,60); },
  coracao(){ nota(150,0,.12,"sine",.25); nota(120,.18,.16,"sine",.22); }
};
let rumor = null, rumorG = null;
function rumorLiga(){
  const ac = audio(); if(!ac || rumor) return;
  const n = Math.floor(ac.sampleRate*2), buf = ac.createBuffer(1,n,ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  rumor = ac.createBufferSource(); rumor.buffer = buf; rumor.loop = true;
  const f = ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=170;
  rumorG = ac.createGain(); rumorG.gain.value=.0001;
  rumorG.gain.exponentialRampToValueAtTime(.3, ac.currentTime+1.2);
  rumor.connect(f); f.connect(rumorG); rumorG.connect(ac.destination); rumor.start();
}
function rumorDesliga(){
  if(!rumor) return;
  try{
    rumorG.gain.cancelScheduledValues(AC.currentTime);
    rumorG.gain.setTargetAtTime(.0001, AC.currentTime, .12);
    rumor.stop(AC.currentTime+.6);
  }catch(e){ try{ rumor.stop(); }catch(e2){} }
  rumor = null;
}



/* ---- TOCADOR DE VOZ GRAVADA -------------------------------------
   As falas foram gravadas em arquivo com a voz do próprio Mac
   (pasta "voz/"). Isso não depende da síntese do navegador, que
   estava muda aqui. Se faltar algum clipe, cai na voz do navegador.
   ------------------------------------------------------------------ */
let clipeAtual = null, soltaClipe = null;
function temClipe(t){ return !!(window.VOZ && window.VOZ[t]); }

/* Clipes já pedidos ficam guardados (os 60 mais recentes): o mesmo
   <audio> que foi pré-carregado é o que toca, sem baixar de novo. */
const PRE = new Map();
function pegaAudio(nome){
  let a = PRE.get(nome);
  if(a && a.error) a = null;                 // falhou antes (sem rede): tenta de novo
  PRE.delete(nome);
  if(!a){ a = new Audio("voz/" + nome + ".m4a"); try{ a.preload = "auto"; }catch(e){} }
  PRE.set(nome, a);
  if(PRE.size > 60) PRE.delete(PRE.keys().next().value);
  return a;
}
/* adianta o download das próximas falas (aceita vários textos) */
function preCarrega(){
  if(!S.voz || !window.VOZ) return;
  for(let i=0;i<arguments.length;i++){
    const t = arguments[i]; if(!t) continue;
    partesComNome(humaniza(t)).forEach(c=>{ if(temClipe(c)) pegaAudio(window.VOZ[c]); });
  }
}
function tocaClipe(trecho, op){
  return new Promise(res=>{
    pararClipe();
    const a = pegaAudio(window.VOZ[trecho]);
    let pronto = false, teto = null;
    const fim = ()=>{
      if(pronto) return;
      pronto = true; clearTimeout(teto);
      a.onended = null; a.onerror = null;
      if(clipeAtual === a) clipeAtual = null;
      if(soltaClipe === fim) soltaClipe = null;
      res();
    };
    a.onended = fim;
    a.onerror = fim;
    try{
      if(a.currentTime) a.currentTime = 0;
      a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
      const r = (op && op.rate) ? op.rate/0.87 : 1;
      a.playbackRate = Math.max(.55, Math.min(1.5, r));
    }catch(e){}
    clipeAtual = a; soltaClipe = fim;
    const pr = a.play();
    if(pr && pr.catch) pr.catch(()=>fim());
    teto = setTimeout(fim, 16000);
  });
}
/* Parar o clipe também SOLTA quem estava esperando ele acabar. Antes o
   pause() não disparava "ended" e a fala cortada só era liberada 16 s
   depois — e aí continuava o roteiro por cima de outra tela. */
function pararClipe(){
  const a = clipeAtual, f = soltaClipe;
  clipeAtual = null; soltaClipe = null;
  if(a){ try{ a.pause(); }catch(e){} }
  if(f) f();
}

/* ---- DESTRAVA DA VOZ ------------------------------------------
   Safari e Chrome só liberam a síntese se speak() for chamado
   DENTRO do gesto do usuário, de forma síncrona. Por isso isto
   roda no primeiro pointerdown da página, antes de qualquer await.
   Texto curto e volume zero: silencioso, e sem travar a fila. --- */
let vozDestravada = false;
function destravaVoz(){
  if(vozDestravada) return;
  vozDestravada = true;
  if("speechSynthesis" in window){
    try{
      const u = new SpeechSynthesisUtterance("oi");
      u.volume = 0; u.rate = 2; u.lang = "pt-BR";
      speechSynthesis.speak(u);
    }catch(e){}
    try{ speechSynthesis.getVoices(); }catch(e){}
  }
  try{ const a=new Audio(); a.muted=true; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
document.addEventListener("pointerdown", destravaVoz, true);
document.addEventListener("keydown", destravaVoz, true);

/* se mesmo assim a voz não sair, o adulto precisa saber */
function avisaVozMuda(){
  /* com os clipes gravados carregados, a síntese muda não é problema:
     o aviso (texto para adulto) não deve aparecer na tela da criança */
  if(window.VOZ) return;
  if(document.getElementById("aviso-voz")) return;
  const d=document.createElement("div");
  d.id="aviso-voz";
  d.style.cssText="position:fixed;left:10px;right:10px;bottom:10px;z-index:999;background:#FFF3F4;"+
    "border:3px solid #FF5A6E;border-radius:18px;padding:11px 14px;font:800 13px/1.35 Nunito,system-ui,sans-serif;"+
    "color:#3A2B52;box-shadow:0 10px 26px rgba(58,43,82,.25)";
  d.innerHTML='A voz do sistema não está respondendo neste navegador. '+
    'Abra <b>0-testar-voz.html</b> (mesma pasta) para verificar, ou tente abrir o jogo no Chrome. '+
    '<button style="margin-left:8px;border:0;background:#FF5A6E;color:#fff;border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer">ok</button>';
  d.querySelector("button").onclick=()=>d.remove();
  document.body.appendChild(d);
}

/* --- motor de fala robusto ---------------------------------
   Três defesas: espera as vozes carregarem; se a fala não
   COMEÇAR, tenta de novo e depois desiste (em vez de travar o
   jogo esperando); e mantém o Chrome acordado, que corta a voz
   sozinho depois de alguns segundos.
   ----------------------------------------------------------- */
let vozPT = null, vozesOk = false, vozQuebrada = false, batida = null;
function pegaVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if(!vs || !vs.length) return;
  vozesOk = true;
  const br = vs.filter(v=>/pt[-_]BR/i.test(v.lang));
  const boa = /aprimorad|enhanced|premium|neural|natural|siri/i;
  /* ordem de preferência: Premium > vozes novas e expressivas > Luciana */
  const naturais = /^(Flo|Sandy|Shelley|Grandma)\b/i;
  vozPT = br.find(v=>boa.test(v.name))
       || br.find(v=>naturais.test(v.name))
       || br.find(v=>/Luciana|Joana|Francisca|Camila|Vit[oó]ria/i.test(v.name))
       || br[0]
       || vs.find(v=>/^pt/i.test(v.lang)) || null;
}

  pegaVoz();
  speechSynthesis.onvoiceschanged = pegaVoz;
  /* Chrome interrompe a fala sozinho por volta dos 15 s */
  batida = setInterval(()=>{
    try{ if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  }, 5000);
}
async function esperaVozes(){
  if(vozesOk || !("speechSynthesis" in window)) return;
  for(let i=0;i<14 && !vozesOk;i++){ pegaVoz(); if(vozesOk) break; await espera(100); }
  vozesOk = true;
}

/* CAIXA ALTA sai robótica na síntese — só o balão mostra maiúscula */
function humaniza(t){
  return String(t)
    .replace(/\b[A-ZÁÂÃÀÉÊÍÓÔÕÚÜÇ]{2,}\b/g, m => m.charAt(0)+m.slice(1).toLowerCase())
    .replace(/\s+/g, " ").trim();
}
function pedacos(t){
  const bruto = []; let buf = "";
  for(const ch of t){ buf += ch; if(".!?…:;,".indexOf(ch) >= 0){ bruto.push(buf.trim()); buf = ""; } }
  if(buf.trim()) bruto.push(buf.trim());
  const j = [];
  for(const pe of bruto){
    if(j.length && j[j.length-1].length < 16) j[j.length-1] += " " + pe; else j.push(pe);
  }
  return j.length ? j : [t];
}
/* ---- O NOME DA CRIANÇA É UM CLIPE À PARTE ----------------------
   Assim o jogo serve a qualquer família: a fala é quebrada no nome
   e o nome vira um áudio separado, escolhido pelo cadastro. -------- */
function quebraPeloNome(t){
  const nome=(S.nome||"").trim();
  if(!nome || t.indexOf(nome)<0) return pedacos(t);
  const saida=[];
  t.split(nome).forEach((frag,i)=>{
    if(i) saida.push(nome);
    frag=frag.trim().replace(/^[,;]\s*/,"");
    if(frag) pedacos(frag).forEach(c=>saida.push(c));
  });
  return saida.length?saida:pedacos(t);
}
/* ---- QUEBRA QUE CASA COM OS CLIPES GRAVADOS ---------------------
   A quebra de cima às vezes junta frases de um jeito que não foi
   gravado ("Tenta outra. Cadê a carinha de Raiva?", "Aí é a cabeça.
   Quando") e o trecho caía na voz do navegador, mesmo existindo os
   clipes das frases separadas. Quando isso acontece, procura-se a
   divisão (nos mesmos pontos: pontuação e o nome da criança) com o
   menor número de pedaços sem clipe. Se nada melhora, fica a de cima. */
function semClipe(lista){ let n=0; lista.forEach(c=>{ if(!temClipe(c)) n++; }); return n; }
function partesComNome(t){
  const velha = quebraPeloNome(t);
  const faltaVelha = semClipe(velha);
  if(!faltaVelha || !window.VOZ) return velha;
  const nome=(S.nome||"").trim();
  const cortes = new Set([0, t.length]);
  for(let i=0;i<t.length;i++){ if(".!?…:;,".indexOf(t[i]) >= 0) cortes.add(i+1); }
  if(nome){ let k=-1; while((k=t.indexOf(nome,k+1)) >= 0){ cortes.add(k); cortes.add(k+nome.length); } }
  const P = Array.from(cortes).sort((a,b)=>a-b), n = P.length;
  if(n > 40) return velha;
  const melhor = new Array(n); melhor[0] = {f:0, q:0, ant:-1, s:""};
  for(let j=1;j<n;j++){
    for(let i=0;i<j;i++){
      if(!melhor[i]) continue;
      const s = t.slice(P[i], P[j]).trim();
      let f, q;
      if(!/[0-9A-Za-zÀ-ÿ]/.test(s)){ f=0; q=0; }        // só pontuação: nada a dizer
      else if(temClipe(s)){ f=0; q=1; }
      else if(j === i+1){ f=1; q=1; }                    // pedaço mínimo sem clipe
      else continue;                                     // junção só vale se estiver gravada
      const c = {f:melhor[i].f+f, q:melhor[i].q+q, ant:i, s:(q?s:"")};
      if(!melhor[j] || c.f < melhor[j].f || (c.f === melhor[j].f && c.q < melhor[j].q)) melhor[j] = c;
    }
  }
  const fim = melhor[n-1];
  if(!fim || fim.f >= faltaVelha) return velha;
  const saida = [];
  for(let j=n-1; j>0; j=melhor[j].ant){ if(melhor[j].s) saida.unshift(melhor[j].s); }
  return saida.length ? saida : velha;
}


let ultimaFala = "";
/* `falada` = texto que tem voz. As dicas só escritas ("Soprando… fuuuuu…")
   não viram a fala do botão "ouvir de novo" (não têm clipe gravado). */
function mostraBalao(txt, falada){
  if(falada) ultimaFala = txt;
  const b = $("#balao");
  if(!b) return;
  $("#fala").textContent = txt;
  b.classList.toggle("vazio", !txt);
}

function novaFala(trecho, op){
  const u = new SpeechSynthesisUtterance(trecho);
  if(vozPT) u.voice = vozPT;
  u.lang  = "pt-BR";
  u.rate  = op.rate  || .87;
  u.pitch = op.pitch || 1.06;
  u.volume = 1;
  return u;
}
function dizNavegador(trecho, op){
  return new Promise(res=>{
    if(vozQuebrada) return setTimeout(res, Math.min(1600, 300+trecho.length*35));
    let pronto = false, comecou = false, tGuarda = null, tTeto = null;
    const fim = ()=>{
      if(pronto) return;
      pronto = true; clearTimeout(tGuarda); clearTimeout(tTeto); res();
    };
    const u = novaFala(trecho, op);
    u.onstart = ()=>{ comecou = true; };
    u.onend = fim; u.onerror = fim;
    /* não começou em 700 ms? limpa a fila e tenta uma segunda vez */
    tGuarda = setTimeout(()=>{
      if(comecou) return;
      try{ speechSynthesis.cancel(); }catch(e){}
      const u2 = novaFala(trecho, op);
      u2.onstart = ()=>{ comecou = true; };
      u2.onend = fim; u2.onerror = fim;
      try{ speechSynthesis.speak(u2); }catch(e){}
      /* nem na segunda? a voz não funciona aqui: segue sem travar o jogo */
      setTimeout(()=>{ if(!comecou){ vozQuebrada = true; avisaVozMuda(); fim(); } }, 1000);
    }, 700);
    tTeto = setTimeout(fim, 900 + trecho.length*95);
    try{ speechSynthesis.speak(u); }catch(e){ fim(); }
  });
}

const temSintese = ("speechSynthesis" in window);
function diz(trecho, op){
  op = op || {};
  if(temClipe(trecho)) return tocaClipe(trecho, op);
  /* sem clipe e sem síntese no aparelho: pula o trecho sem travar */
  if(!temSintese) return espera(Math.min(1200, 250 + trecho.length*30));
  return dizNavegador(trecho, op);
}

/* falar() devolve true se a fala foi até o fim e false se foi cortada
   (outra fala começou, ou calar()). Quem encadeia falas confere isso
   ou a senha da cena antes de continuar. */
let falaId = 0, falaViva = 0;
async function falar(txt, opts){
  opts = opts || {};
  if(opts.balao !== false) mostraBalao(txt, true);
  const limpo = humaniza(txt);
  const meu = ++falaId;
  falaViva = meu;
  pararClipe();
  const terminou = ()=>{ const ok = (meu === falaId); if(ok) falaViva = 0; return ok; };
  if(!S.voz || !limpo){
    await espera(opts.pausa === undefined ? 600 : opts.pausa);
    return terminou();
  }
  const chunks = partesComNome(limpo);
  if(temSintese){
    /* a síntese do navegador só é necessária se faltar algum clipe gravado */
    if(!chunks.every(temClipe)){ await esperaVozes(); if(meu !== falaId) return false; }
    try{
      if(speechSynthesis.speaking || speechSynthesis.pending){
        speechSynthesis.cancel();
        await espera(140);
        if(meu !== falaId) return false;
      }
    }catch(e){}
  }
  const gap = opts.gap === undefined ? 60 : opts.gap;
  for(let i=0;i<chunks.length;i++){
    await diz(chunks[i], opts);
    if(meu !== falaId) return false;
    if(i < chunks.length-1){ await espera(gap); if(meu !== falaId) return false; }
  }
  await espera(opts.pausa === undefined ? 160 : opts.pausa);
  return terminou();
}
function calar(){ falaId++; falaViva = 0; pararClipe(); if(temSintese){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ==========================================================
   3. ARCO-ÍRIS DE PROGRESSO
   ========================================================== */
const RAIOS = [500,448,396,344,292,240];
function montaArcoiris(){
  const svg = $("#arcoiris"), cx = 530, cy = 545;
  let h = `<defs>`;
  CORES.forEach((c,i)=>{
    h += `<linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".55"/></linearGradient>`;
  });
  h += `</defs>`;
  RAIOS.forEach((r,i)=>{
    const d = `M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy}`;
    h += `<path class="faixa" d="${d}"/>`;
  });
  RAIOS.forEach((r,i)=>{
    const d = `M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy}`;
    const L = Math.PI*r;
    h += `<path class="faixa faixa-viva" id="fx${i}" d="${d}" style="stroke:url(#g${i})" stroke-dasharray="${L}" stroke-dashoffset="${L}"/>`;
  });
  h += `<g id="uni-arco" opacity="0"></g>`;
  svg.innerHTML = h;
  pintaArcoiris(false);
}
function pintaArcoiris(anim){
  RAIOS.forEach((r,i)=>{
    const p = $("#fx"+i); if(!p) return;
    const L = Math.PI*r;
    const f = Math.max(0, Math.min(1, S.prog[i]||0));
    p.classList.toggle("acesa", f>0);
    if(!anim) p.style.transition = "none";
    p.style.strokeDashoffset = L*(1-f);
    if(!anim) requestAnimationFrame(()=>{ p.style.transition = ""; });
  });
  $$("#trilha .pt").forEach((d,i)=>{
    d.classList.toggle("feita", (S.prog[i]||0) >= 1);
    d.style.background = (S.prog[i]||0) >= 1 ? CORES[i] : "";
  });
}
function montaTrilha(){
  $("#trilha").innerHTML = CORES.map(()=>`<div class="pt"></div>`).join("");
}

/* ==========================================================
   4. CONFETE / PARTÍCULAS
   ========================================================== */
const cv = $("#fx"), ctx = cv.getContext("2d");
let parts = [], animando = false;
function ajustaCanvas(){
  const d = Math.min(window.devicePixelRatio||1, 2);
  cv.width = innerWidth*d; cv.height = innerHeight*d;
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize", ajustaCanvas); ajustaCanvas();

function confete(n, x, y){
  if(reduzir) n = Math.min(n, 20);
  for(let i=0;i<n;i++){
    parts.push({
      x: x!==undefined ? x : Math.random()*innerWidth,
      y: y!==undefined ? y : -20 - Math.random()*innerHeight*.3,
      vx:(Math.random()-.5)*7, vy: y!==undefined ? -Math.random()*11-3 : Math.random()*2+1.5,
      g:.19, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.28,
      w:7+Math.random()*10, h:5+Math.random()*8,
      c: CORES[(Math.random()*CORES.length)|0], vida:1
    });
  }
  if(!animando){ animando = true; requestAnimationFrame(laco); }
}
function laco(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>{
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .995;
    if(p.y > innerHeight+40) return false;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.globalAlpha = .95;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    return true;
  });
  if(parts.length) requestAnimationFrame(laco);
  else { animando = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ==========================================================
   6. NAVEGAÇÃO
   ========================================================== */
let etapaAtual = -1, rodadaAtual = 0, ocupado = false;

/* ---- CENAS ------------------------------------------------
   Cada passo do jogo é uma "cena" com uma senha (cenaId). Tudo
   que espera uma fala ou um timer confere a senha antes de
   continuar: se a criança saiu da etapa, abriu a flor ou a área
   do adulto, a senha mudou e o resto daquela cena é abandonado
   (antes ele continuava rodando por cima da tela seguinte).
   `retoma` guarda como voltar ao ponto em que ela estava e
   `repete` o que o botão "ouvir de novo" deve fazer na cena.
   ----------------------------------------------------------- */
let cenaId = 0, retoma = null, repete = null;
let comIntro = false, emIntro = false;
function novaCena(volta){
  retoma = volta || null; repete = null;
  ocupado = false; emIntro = false;
  return ++cenaId;
}
const viva = tk => tk === cenaId;
function pausaCena(){
  cenaId++; ocupado = false; emIntro = false;
  calar(); rumorDesliga(); paraRespiroVulcao();
}
function retomar(){
  if($(".ov.on")) return;
  if(retoma && $("#t-jogo").classList.contains("on")) retoma();
}

/* toque duplo: o segundo toque caía no botão da tela que acabou de entrar */
let travaToque = 0;
function tela(id){
  $$(".tela").forEach(t=>t.classList.remove("on"));
  $("#t-"+id).classList.add("on");
  travaToque = performance.now() + 320;
  const fora = (id === "inicio" || id === "mapa");
  $("#btCasa").setAttribute("aria-label", fora ? "Voltar para a escolha de jogos" : "Voltar para o mapa");
}
$("#app").addEventListener("click", e=>{
  if(performance.now() < travaToque){ e.stopPropagation(); e.preventDefault(); }
}, true);
/* o app nunca rola (âncora na URL, foco em campo): se rolar, volta ao lugar */
$("#app").addEventListener("scroll", e=>{ const a = e.currentTarget; if(a.scrollTop || a.scrollLeft){ a.scrollTop = 0; a.scrollLeft = 0; } });
addEventListener("scroll", ()=>{ if(scrollX || scrollY) scrollTo(0,0); });

function liberadas(){
  let n = 1;
  for(let i=0;i<6;i++){ if((S.prog[i]||0) >= 1) n = i+2; }
  return Math.min(n, 6);
}
/* o progresso só sobe: estrela conquistada não se perde ao jogar de novo */
function marca(i, f){
  if(i < 0 || i > 5) return;
  S.prog[i] = Math.max(S.prog[i]||0, Math.min(1, f));
  pintaArcoiris(true); salvar();
}
function montaMapa(){
  const lib = liberadas();
  $("#ilhas").innerHTML = ETAPAS.map((e,i)=>{
    const trava = i >= lib;
    const feita = (S.prog[i]||0) >= 1;
    return `<button class="ilha ${trava?"travada":""} ${(!trava&&!feita&&i===lib-1)?"agora":""}" data-e="${i}">
      ${feita?`<span class="selo">⭐</span>`:""}
      <div class="bolha" style="background:${CORES[i]}">${trava?`<svg viewBox="0 0 40 40"><rect x="10" y="18" width="20" height="15" rx="4" fill="#fff"/><path d="M15,18 v-4 a5,5 0 0110,0 v4" stroke="#fff" stroke-width="3.4" fill="none"/></svg>`:ICONES[i]}</div>
      <span class="nome">${e.nome.replace(/\n/g,"<br>")}</span>
    </button>`;
  }).join("");
  $$("#ilhas .ilha").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.e;
      SFX.toque();
      if(i >= liberadas()){
        b.classList.remove("nega"); void b.offsetWidth; b.classList.add("nega");
        falar(`Essa ilha ainda está dormindo. Termina a de antes que ela acorda!`);
        return;
      }
      abreEtapa(i);
    });
  });
}

/* a fala tem clipe gravado para todos os pedaços? */
function temVoz(t){ return partesComNome(humaniza(t)).every(temClipe); }
function irMapa(deFesta){
  novaCena(null);
  calar(); rumorDesliga(); paraRespiroVulcao();
  etapaAtual = -1;
  montaMapa(); pintaArcoiris(true); tela("mapa");
  const done = S.prog.filter(p=>p>=1).length;
  /* "Já são N ilhas. Qual é a próxima?" ainda não tem clipe gravado e caía
     na voz do navegador. Enquanto não for gravada, usa falas que já existem;
     quando o clipe existir no voz-pacote.js, ela volta sozinha. */
  const contagem = `Muito bem! Já são ${done} ${done===1?"ilha":"ilhas"}. Qual é a próxima?`;
  falar(done===0 ? `Escolhe uma ilha pra gente começar!`
       : done>=6 ? `Você já fez todas! Pode brincar de novo na que quiser.`
       : temVoz(contagem) ? contagem
       : deFesta ? `Muito bem!`
       : `Escolhe uma ilha pra gente começar!`);
  /* adianta o download da voz da ilha que ela provavelmente vai abrir */
  const prox = ETAPAS[Math.min(liberadas(), 6) - 1];
  if(prox && prox.rodadas) preCarrega(prox.intro());
}

function abreEtapa(i){
  etapaAtual = i; rodadaAtual = 0; comIntro = true;
  /* só zera o que estava pela metade; etapa concluída continua com a estrela */
  if((S.prog[i]||0) < 1){ S.prog[i] = 0; salvar(); }
  pintaArcoiris(true);
  tela("jogo");
  const e = ETAPAS[i];
  if(e.especial === "vulcao") return iniciaVulcao();
  if(e.especial === "ainda")  return iniciaAinda();
  rodada();
}
/* A abertura da ilha é falada com a primeira rodada já na tela.
   Enquanto ela toca, um toque nas opções só pula a abertura. */
async function abertura(tk){
  if(!comIntro) return;
  comIntro = false; emIntro = true;
  await falar(ETAPAS[etapaAtual].intro());
  if(viva(tk)) emIntro = false;
}
async function acertou(msg){
  if(ocupado) return;
  const e = ETAPAS[etapaAtual];
  if(!e || !e.rodadas) return;
  ocupado = true;
  const tk = cenaId;
  SFX.acerto(); confete(26, innerWidth/2, innerHeight*.55);
  rodadaAtual++;
  marca(etapaAtual, rodadaAtual / e.rodadas.length);
  const fim = rodadaAtual >= e.rodadas.length;
  retoma = fim ? festa : rodada;          // se interromper agora, segue daqui
  if(fim) preCarrega(FESTA_FALA[etapaAtual]()); else preRodada();
  await falar(msg);
  if(!viva(tk)) return;
  if(fim) festa(); else rodada();
}
/* errar não trava nada: ela pode tocar em outra opção por cima da fala */
function errou(msg, alvo){
  SFX.tentar();
  const p = $("#palco");
  p.classList.add("tremendo");
  setTimeout(()=>p.classList.remove("tremendo"), 420);
  if(alvo){ alvo.classList.add("errada"); setTimeout(()=>alvo.classList.remove("errada"), 700); }
  falar(msg);
}

const DICAS_ERRO = [
  ()=>`Quase! Vamos olhar de novo com calma.`,

  ()=>`Hmm, não foi essa. Mas eu sei que você acha!`

const sorteia = a => a[(Math.random()*a.length)|0];

/* ---------- roteador de rodada ---------- */
function rodada(){
  if(etapaAtual === 0) return rodadaCaras();
  if(etapaAtual === 1) return rodadaCorpo();
  if(etapaAtual === 3) return rodadaEscolha();
  if(etapaAtual === 4) return rodadaFala();
}
/* deixa a voz da rodada já baixada, para não atrasar em rede lenta */
function preRodada(){
  const e = ETAPAS[etapaAtual]; if(!e || !e.rodadas) return;
  const r = e.rodadas[rodadaAtual]; if(!r) return;
  if(etapaAtual === 0) preCarrega(`Cadê a carinha de ${NOMES_EMO[r.alvo]}?`, r.depois());
  else if(etapaAtual === 1) preCarrega(r.pede(), r.depois());
  else preCarrega.apply(null, [r.cena()].concat(r.ops.map(o=>o.r||o.f), [`O que você escolhe?`, r.depois()]));
}

/* As opções já respondem enquanto a unicórnia ainda está lendo:
   o toque corta a leitura. O botão "ouvir de novo" lê tudo outra vez. */
async function ligaEscolha(r, txt){
  const tk = novaCena(rodada);
  const cards = $$("#palco .op");
  cards.forEach(b=>{
    b.addEventListener("click", ()=>{
      if(ocupado || !viva(tk)) return;
      if(emIntro){ calar(); return; }
      const o = r.ops[+b.dataset.i];
      SFX.toque();
      if(o.ok){ b.classList.add("certa"); acertou(r.depois()); }
      else errou(`Hmm... isso deixa a raiva ainda maior. Que tal outro jeito?`, b);
    });
  });
  const narra = async ()=>{
    cards.forEach(c=>c.classList.remove("falando"));
    if(!(await falar(r.cena())) || !viva(tk)) return;
    for(let i=0;i<cards.length;i++){
      cards[i].classList.add("falando");
      const ok = await falar(txt(r.ops[i]), {balao:false});
      cards[i].classList.remove("falando");
      if(!ok || !viva(tk)) return;
    }
    falar(`O que você escolhe?`);
  };
  repete = ()=>{ if(!ocupado && viva(tk)) narra(); };
  preRodada();
  await abertura(tk);
  if(!viva(tk)) return;
  narra();
}

/* O ritmo da respiração (4 s puxando, 2,2 s soltando) é o conteúdo:
   não mexer nesses tempos. */
function ligaRespiro(tk){
  const bt = $("#florBt"), anel = $("#anel"), flor = $("#florsvg");
  if(!bt) return;
  const comeca = ev=>{
    ev.preventDefault();
    if(!viva(tk) || segurando || faseResp !== "espera") return;
    segurando = true; dedoFlor = ev.pointerId; faseResp = "inspirando";
    try{ bt.setPointerCapture(ev.pointerId); }catch(e){}
    anel.classList.remove("expira"); anel.classList.add("inspira");
    flor.classList.add("crescendo");
    SFX.inspira();
    mostraBalao("Cheira a florzinha… devagaaar…");
    tInsp = setTimeout(()=>{
      if(!viva(tk) || !segurando) return;
      faseResp = "cheio";
      SFX.brilho();
      falar(`Agora solta o ar bem devagar na velinha!`);
    }, 4000);
  };
  const solta = ev=>{
    if(ev){
      ev.preventDefault();
      /* outro dedo encostando e saindo não conta como soltar */
      if(dedoFlor !== null && ev.pointerId !== undefined && ev.pointerId !== dedoFlor) return;
    }
    if(!segurando || !viva(tk)) return;
    segurando = false; dedoFlor = null;
    clearTimeout(tInsp);
    anel.classList.remove("inspira");
    flor.classList.remove("crescendo");
    if(faseResp !== "cheio"){
      faseResp = "espera";
      anel.classList.add("expira");
      SFX.tentar();
      falar(`Quase! Segura mais um pouquinho, cheirando bem devagar.`);
      return;
    }
    faseResp = "soltando";
    anel.classList.add("expira");
    const ch = $("#chama"); if(ch) ch.classList.add("soprada");
    SFX.expira();
    mostraBalao("Soprando… fuuuuu…");
    tSopro = setTimeout(()=>{
      if(!viva(tk)) return;
      respiros++;
      $$("#palco .gota").forEach((g,i)=>g.classList.toggle("on", i<respiros));
      const v = $("#palco .vulcao-cena");
      if(v) v.innerHTML = vulcaoSVG(3-respiros);
      SFX.acerto();
      marca(2, respiros/3);
      if(respiros >= 3){
        retoma = cenaCalmo;
        tSopro = setTimeout(()=>{ if(viva(tk)) cenaCalmo(); }, 400);
        return;
      }
      /* fica na mesma tela, sem redesenhar: redesenhar com o dedo já na
         flor deixava a flor morta. Ela pode segurar de novo na hora. */
      faseResp = "espera";
      anel.classList.remove("expira");
      const c2 = $("#chama"); if(c2) c2.classList.remove("soprada");
      falar(`Olha! A lava desceu um pouquinho. Vamos de novo?`);
    }, 2200);
  };
  bt.addEventListener("pointerdown", comeca);
  bt.addEventListener("pointerup", solta);
  bt.addEventListener("pointercancel", solta);
  bt.addEventListener("pointerleave", solta);
}
async function cenaCalmo(){
  const tk = novaCena(cenaCalmo);
  paraRespiroVulcao();
  $("#palco").innerHTML =

  if(!viva(tk)) return;

/* ==========================================================
   8. ETAPA 6 — "EU CONSIGO... AINDA!" + O ESPELHO MÁGICO
   Modelagem por imitação (neurônios-espelho) em três tempos:
   eu faço  ->  nós fazemos juntas  ->  você faz sozinha.
   A criança controla o ritmo: nada avança sem ela apertar.
   ========================================================== */
let passoAinda = 0;
function primeiraLetra(){ return (S.nome.trim()[0] || "A").toUpperCase(); }

const AINDAS = [
  { conta:()=>`Olha só. ${N()} tentou montar uma torre bem alta… e a torre caiu toda no chão.`,
    pensa:"Eu não consigo…",
    vitoria:()=>`E olha o que aconteceu! Ela tentou de um jeito diferente, e a torre ficou em pé. Foi de tanto tentar.`,
    poseFim:"cima" },
  { conta:()=>`${N()} está aprendendo a andar de bicicleta. Ela pedalou, pedalou… e caiu.`,
    pensa:"Eu não consigo…",
    vitoria:()=>`Ela levantou, subiu de novo e pedalou! Cair faz parte de aprender.`,
    poseFim:"cima" },
  /* o pensamento era "Eu não sei ler…", mas a fala seguinte (gravada) é
     "eu não consigo… ainda!" — a tela mostrava uma frase e a voz dizia outra.
     Fica igual às outras duas histórias, que é o que tem clipe. */
  { conta:()=>`${N()} abriu um livro e ficou tristinha, porque ainda não sabe ler as palavras.`,
    pensa:"Eu não consigo…",
    vitoria:()=>`Mas olha que legal! Essa aqui é a letra ${primeiraLetra()}. É a primeira letra do nome ${N()}. Essa ela já conhece! E cada dia ela vai conhecendo mais uma.`,
    poseFim:"mao", letra:true }
];

function iniciaAinda(){ passoAinda = 0; telaAinda(); }

async function telaAinda(){
  if(passoAinda >= AINDAS.length) return espelho();
  const tk = novaCena(telaAinda);

  $("#palco").innerHTML =
    `<div class="fig-ainda" id="fig">${boneca("tristeza")}</div>

     <div id="acao"></div>`;
  preCarrega(`Aí ela pensou assim: ${a.pensa}`,
             `Mas está faltando a palavra mágica no final! Aperta a estrela dourada pra ela aparecer.`,
             `Ainda! Agora ela diz assim: eu não consigo… ainda!`);
  await falar(a.conta());
  if(!viva(tk)) return;
  await falar(`Aí ela pensou assim: ${a.pensa}`, {pitch:.92, rate:.78});
  if(!viva(tk)) return;
  const acao = $("#acao"); if(!acao) return;
  /* a estrela aparece junto com o convite: apertar corta a fala */

/* ---------- O ESPELHO MÁGICO: olhar → juntas → sozinha ---------- */
const AFIRMACOES = [
  {f:"Eu sou corajosa!",             pose:"forte",   gesto:"Faz os bracinhos bem fortes, igual a ela!"},
  {f:"Eu consigo tentar de novo!",   pose:"cima",    gesto:"Levanta os dois braços bem alto!"},
  {f:"Eu sou muito amada!",          pose:"coracao", gesto:"Põe as duas mãos no coração!"},
  {f:"Eu sou uma boa amiga!",        pose:"mao",     gesto:"Estende a mãozinha pra frente!"},
  {f:"Errar faz parte de aprender!", pose:"ombros",  gesto:"Levanta os ombros e dá um sorriso!"}
];
const PARABENS = [
  ()=>`Isso! Eu ouvi daqui. Você falou com o corpo todo!`,
  ()=>`Que voz forte! O espelho brilhou inteirinho.`,
  ()=>`Você fez o gesto e falou junto. É assim que a gente aprende de verdade!`,
  ()=>`Perfeito! Seu corpo e sua voz falaram a mesma coisa.`
];
let afIdx = 0, ritual = 0;

async function espelho(){
  const tk = novaCena(espelho);
  afIdx = 0;
  $("#palco").innerHTML =
    `<p class="pergunta">O espelho mágico</p>
     <div class="moldura brilha"><div class="dentro">${boneca("alegria","","cima")}</div></div>
     <p class="sub">Primeiro você olha. Depois fala comigo. Depois fala sozinha.</p>`;
  preCarrega(`Tempo um: só olhar. Você não precisa falar nada agora, só prestar atenção.`, AFIRMACOES[0].f);
  await falar(`Chegou o espelho mágico! Esse é o jogo de imitar.`);
  if(!viva(tk)) return;
  await falar(`São três tempos. Primeiro você só olha a ${N()} fazer. Depois nós duas fazemos juntas. E no fim, você faz sozinha!`);
  if(!viva(tk)) return;
  telaAfirmacao();
}
function telaAfirmacao(){
  if(afIdx >= AFIRMACOES.length) return fimEspelho();
  ritual = 0; desenhaRitual();
}
function desenhaRitual(){
  const tk = novaCena(desenhaRitual);
  const a = AFIRMACOES[afIdx];
  const passos = [["👀","Olha"],["🤝","Juntas"],["⭐","Só você"]];
  $("#palco").innerHTML =
    `<div class="ritual">${passos.map((pp,i)=>

     <div class="moldura ${ritual>0?"brilha":""}"><div class="dentro" id="molduraFig">${boneca("alegria","", ritual===0?"normal":a.pose)}</div></div>
     <p class="frase-espelho">${a.f}</p>
     <p class="gesto-dica">${a.gesto}</p>
     <div id="acaoEsp"></div>
     <div class="estrelinhas">${AFIRMACOES.map((_,i)=>
       `<svg style="width:24px" viewBox="0 0 100 100"><path d="M50,5 l12,29 31,2 -24,20 8,30 -27,-17 -27,17 8,-30 -24,-20 31,-2z" fill="${i<afIdx?CORES[i]:"rgba(58,43,82,.14)"}"/></svg>`).join("")}</div>`;
  rodaRitual(tk);
}
function fazGesto(pose){
  const d = $("#molduraFig"); if(!d) return;
  d.innerHTML = boneca("alegria","",pose);
  d.classList.remove("fazGesto"); void d.offsetWidth; d.classList.add("fazGesto");

/* A explicação comprida de cada tempo é dita na primeira frase do espelho.
   Nas seguintes vai só o começo dela ("Tempo um: só olhar."), que é o
   mesmo clipe gravado — as cinco frases repetiam a explicação inteira.
   O botão de cada tempo aparece junto com a última fala (apertar corta). */
async function rodaRitual(tk){
  const a = AFIRMACOES[afIdx], curto = afIdx > 0;
  if(ritual === 0){
    preCarrega(a.f, `Viu o gesto que ela fez? ${a.gesto}`, `Tempo dois: nós duas juntas. Faz o gesto e fala junto comigo, bem devagarinho.`);
    await falar(curto ? `Tempo um: só olhar.`
                      : `Tempo um: só olhar. Você não precisa falar nada agora, só prestar atenção.`);
    if(!viva(tk)) return;
    fazGesto(a.pose); SFX.brilho();
    await espera(300);
    if(!viva(tk)) return;
    await falar(a.f, {pitch:1.42, rate:.78});
    if(!viva(tk)) return;
    botaoRitual(tk, "AGORA NÓS DUAS", "#9B6BF2", "#7A4CD1");
    falar(`Viu o gesto que ela fez? ${a.gesto}`);
  } else if(ritual === 1){
    fazGesto(a.pose);
    preCarrega(`Quando vocês terminarem, aperta o botão.`, `Tempo três: agora é só você! Faz o gesto e fala bem alto. Pode demorar o quanto quiser, eu espero aqui.`);
    await falar(curto ? `Tempo dois: nós duas juntas.`
                      : `Tempo dois: nós duas juntas. Faz o gesto e fala junto comigo, bem devagarinho.`);
    if(!viva(tk)) return;
    await espera(300);
    if(!viva(tk)) return;
    await falar(a.f, {rate:.6, pitch:1.18});
    if(!viva(tk)) return;
    botaoRitual(tk, "AGORA SÓ EU", "#FF9A3D", "#DB7620");
    falar(`Quando vocês terminarem, aperta o botão.`);
  } else {
    fazGesto(a.pose);
    botaoRitual(tk, "EU FALEI!", "#3FCB8E", "#2AA372", true);
    falar(curto ? `Tempo três: agora é só você!`
                : `Tempo três: agora é só você! Faz o gesto e fala bem alto. Pode demorar o quanto quiser, eu espero aqui.`);
  }
}
function botaoRitual(tk, txt, bg, dark, esperando){
  const el = $("#acaoEsp"); if(!el) return;
  el.innerHTML = `<button class="bt ${esperando?"esperando":""}" id="btRit" style="--bg:${bg};--dark:${dark}">${txt}</button>`;
  $("#btRit").addEventListener("click", async ()=>{
    if(ocupado || !viva(tk)) return;
    SFX.toque();
    if(ritual < 2){ ritual++; desenhaRitual(); return; }
    ocupado = true;
    $("#btRit").classList.remove("esperando");
    SFX.estrela(); SFX.acerto(); confete(44, innerWidth/2, innerHeight*.55);
    afIdx++;
    marca(5, (AINDAS.length + afIdx/AFIRMACOES.length)/(AINDAS.length+1));
    retoma = telaAfirmacao;                // se interromper agora, segue na próxima frase
    await falar(sorteia(PARABENS)());
    if(!viva(tk)) return;
    telaAfirmacao();
  });
}
async function fimEspelho(){
  const tk = novaCena(fimEspelho);
  marca(5, 1);
  preCarrega(FESTA_FALA[5]());
  await falar(`Você falou tudo sozinha! Guarda essas frases dentro de você. Elas são suas.`);
  if(!viva(tk)) return;
  festa();
}

/* ==========================================================
   10. RESPIRAÇÃO AVULSA (botão da flor, sempre disponível)
   Abrir pausa a cena que estava rodando; fechar retoma dela.
   ========================================================== */
let respAvulso = 0, segAv = false, tAv = null, tAv2 = null, faseAv = "espera", respId = 0, dedoAv = null;
function abreRespiro(){
  if($(".ov.on")) return;
  pausaCena();
  respAvulso = 0;
  $("#ov-respiro").classList.add("on");
  passoRespiro();
  falar(`Vamos respirar juntinhos. Segura na flor e cheira bem devagar.`);
}
function fechaRespiro(){
  respId++;
  clearTimeout(tAv); clearTimeout(tAv2);
  segAv = false; dedoAv = null; faseAv = "espera";
  $("#ov-respiro").classList.remove("on");
  calar();
  retomar();
}
function passoRespiro(){
  const meu = ++respId;
  clearTimeout(tAv); clearTimeout(tAv2);
  segAv = false; dedoAv = null; faseAv = "espera";
  $("#folha-respiro").innerHTML =
    `<p class="pergunta">Respira comigo</p>
     <div class="flor-bt" id="florAv"><div class="anel" id="anelAv"></div>${florSVG().replace('id="florsvg"','id="florAv2"')}</div>
     <div class="contador">${[0,1,2].map(i=>`<div class="gota ${i<respAvulso?"on":""}"></div>`).join("")}</div>
     <button class="bt pequeno" id="fechaResp" style="--bg:#fff;--dark:rgba(58,43,82,.16);color:var(--tinta)">Fechar</button>`;
  $("#fechaResp").addEventListener("click", ()=>{ SFX.toque(); fechaRespiro(); });
  preCarrega(`Agora solta o ar devagar.`, `Segura mais um pouquinho, bem devagar.`, `Muito bem. Mais uma vez.`, `Prontinho. Seu corpo já tá mais calminho.`);
  const bt = $("#florAv"), anel = $("#anelAv"), flor = $("#florAv2");
  const comeca = ev=>{
    ev.preventDefault();
    if(meu !== respId || segAv || faseAv !== "espera") return;
    segAv = true; dedoAv = ev.pointerId; faseAv = "inspirando";
    try{ bt.setPointerCapture(ev.pointerId); }catch(e){}
    anel.classList.remove("expira"); anel.classList.add("inspira");
    flor.classList.add("crescendo"); SFX.inspira();
    mostraBalao("Cheira a flor… devagaaar…");
    tAv = setTimeout(()=>{
      if(meu !== respId || !segAv) return;
      faseAv = "cheio"; SFX.brilho(); falar(`Agora solta o ar devagar.`);
    }, 4000);
  };
  const solta = ev=>{
    if(ev){
      ev.preventDefault();
      if(dedoAv !== null && ev.pointerId !== undefined && ev.pointerId !== dedoAv) return;
    }
    if(meu !== respId || !segAv) return;
    segAv = false; dedoAv = null; clearTimeout(tAv);
    anel.classList.remove("inspira"); flor.classList.remove("crescendo"); anel.classList.add("expira");
    if(faseAv !== "cheio"){ faseAv = "espera"; falar(`Segura mais um pouquinho, bem devagar.`); return; }
    faseAv = "soltando"; SFX.expira(); mostraBalao("Fuuuuuu…");
    tAv2 = setTimeout(async ()=>{
      if(meu !== respId) return;
      respAvulso++;
      $$("#folha-respiro .gota").forEach((g,i)=>g.classList.toggle("on", i<respAvulso));
      SFX.acerto();
      if(respAvulso >= 3){
        await falar(`Prontinho. Seu corpo já tá mais calminho.`);
        if(meu === respId) fechaRespiro();
      } else {
        faseAv = "espera"; anel.classList.remove("expira");
        falar(`Muito bem. Mais uma vez.`);
      }
    }, 2000);
  };
  bt.addEventListener("pointerdown", comeca);
  bt.addEventListener("pointerup", solta);
  bt.addEventListener("pointercancel", solta);
  bt.addEventListener("pointerleave", solta);
}

        <div class="bola" style="background:${CORES[i]}">${i+1}</div>
        <div><h4>${d[0]}</h4><p style="margin-top:2px">${d[1]}</p><p class="base">${d[2]}</p></div>
      </div>`).join("")}

    <h3>Frases para usar em casa</h3>
    <ul>
      <li><strong>Na hora da raiva:</strong> "Você está com muita raiva. Raiva pode. Bater não pode. Vem cá que eu respiro com você."</li>
      <li><strong>Depois que passou:</strong> "O que seu corpo sentiu antes? Coração rápido? Cabeça quente?"</li>
      <li><strong>Quando ela diz "eu não consigo":</strong> "Você não consegue… ainda. Já já você consegue."</li>
      <li><strong>Na leitura:</strong> "Você ainda não lê sozinha, mas já conhece a letra do seu nome. Cada dia você conhece mais uma."</li>
    </ul>

    <div class="aviso">
      <p>Um jogo é apoio, não tratamento. Se as explosões de raiva forem muito frequentes, muito intensas, longas demais para a idade, ou atrapalharem a escola e as amizades, vale conversar com o pediatra ou com uma psicóloga infantil — quanto antes, mais leve.</p>
    </div>

    <hr>
    <h3>A voz do jogo</h3>
    <p>A unicórnia fala com <strong>áudios gravados</strong> (a pasta <strong>voz/</strong> que acompanha o jogo), então a voz é a mesma no celular e no computador e não depende da voz do aparelho. Se alguma frase sair muda, é porque o arquivo dela não carregou — confira a internet.</p>
    <p>A criança não precisa esperar a unicórnia terminar: tocar numa resposta corta a fala. O botão da setinha redonda, ao lado do balão, repete a pergunta. Só a respiração tem tempo fixo — o ritmo lento dela é o exercício.</p>

    <hr>
    <h3>Ajustes</h3>
    <div class="ajustes">
      <div class="campo">
        <label for="in-nome">Nome da personagem (use o nome dela para ela se reconhecer)</label>
        <input type="text" id="in-nome" maxlength="14" value="${S.nome.replace(/"/g,"&quot;")}">
      </div>
      <div class="campo">
        <label>Cor do vestido</label>
        <div class="paleta" id="pal-vestido">${CORES.concat(["#FF7EB6","#20C4C4"]).map(c=>
          `<button class="swatch ${c===S.vestido?"sel":""}" data-c="${c}" style="background:${c}" aria-label="cor ${c}"></button>`).join("")}</div>
      </div>
      <div class="campo">
        <label>Tom de pele</label>
        <div class="paleta" id="pal-pele">${PELES.map(c=>
          `<button class="swatch ${c===S.pele?"sel":""}" data-c="${c}" style="background:${c}" aria-label="tom ${c}"></button>`).join("")}</div>
      </div>
      <div class="campo">
        <label>Cor do cabelo</label>
        <div class="paleta" id="pal-cabelo">${CABELOS.map(c=>
          `<button class="swatch ${c===S.cabelo?"sel":""}" data-c="${c}" style="background:${c}" aria-label="cabelo ${c}"></button>`).join("")}</div>
      </div>
      <div class="campo">
        <label>Prévia</label>
        <div style="width:120px" id="previa">${boneca("alegria")}</div>
      </div>
    </div>
    <div class="campo">
      <label>Voz da unicórnia</label>
      <div class="paleta">
        <button class="bt pequeno" id="btVozAdulto" style="--bg:var(--c4);--dark:#2AA372">Voz ligada</button>
      </div>
      <p style="font-size:13px;color:var(--tinta-2);margin-top:4px">O botão de mudo saiu da tela da criança — ela desligava sem querer e o jogo ficava mudo.</p>
    </div>
    <div class="linha-bt">
      <button class="bt pequeno" id="btSalvar" style="--bg:var(--c4);--dark:#2AA372">Salvar</button>
      <button class="bt pequeno" id="btZerar" style="--bg:#fff;--dark:rgba(58,43,82,.16);color:var(--tinta)">Apagar progresso</button>
    </div>`;

  const liga = (sel, chave)=>{
    $$(sel + " .swatch").forEach(b=>b.addEventListener("click", ()=>{
      $$(sel + " .swatch").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); S[chave] = b.dataset.c;
      $("#previa").innerHTML = boneca("alegria");
      SFX.toque();
    }));
  };
  liga("#pal-vestido","vestido"); liga("#pal-pele","pele"); liga("#pal-cabelo","cabelo");
  $("#in-nome").addEventListener("input", e=>{
    S.nome = e.target.value.trim() || "Nina";
  });
  $("#btSalvar").addEventListener("click", ()=>{
    S.nome = ($("#in-nome").value.trim() || "Nina");
    salvar(); SFX.acerto();
    fechaAdulto(true);
  });
  $("#btFechaAdulto").addEventListener("click", ()=>{ SFX.toque(); fechaAdulto(false); });
  const pintaVoz=()=>{
    const b=$("#btVozAdulto"); if(!b) return;
    b.textContent = S.voz ? "Voz ligada" : "Voz desligada";
    b.style.setProperty("--bg", S.voz ? "var(--c4)" : "#B9B4C4");
    b.style.setProperty("--dark", S.voz ? "#2AA372" : "#8E8A9C");
  };
  pintaVoz();
  $("#btVozAdulto").addEventListener("click", ()=>{
    S.voz=!S.voz; salvar(); calar(); pintaVoz();
    if(S.voz) falar("Voz ligada!");
  });
  /* dois toques para apagar: um toque só apagava todas as estrelas sem perguntar */
  let armado = false, tArma = null;
  $("#btZerar").addEventListener("click", ()=>{
    const b = $("#btZerar"); if(!b) return;
    clearTimeout(tArma);
    const volta = ()=>{ armado = false; const x = $("#btZerar"); if(x) x.textContent = "Apagar progresso"; };
    if(!armado){
      armado = true; b.textContent = "Toque de novo para apagar";
      tArma = setTimeout(volta, 3500);
      return;
    }
    armado = false;
    S.prog = [0,0,0,0,0,0]; diplomaVisto = false;
    salvar(); pintaArcoiris(true); montaMapa(); SFX.tentar();
    b.textContent = "Progresso apagado ✓";
    tArma = setTimeout(volta, 2200);
  });
}

/* ==========================================================
   12. CONTROLES GLOBAIS
   O menu de jogos agora é o index.html (arquivo separado).
   ========================================================== */
const MENU = "index.html";
/* o index abre este arquivo com #adulto quando a engrenagem de lá é usada */
const veioDoIndex = (location.hash === "#adulto");

function desenhaCapa(){
  $("#capa").innerHTML = `<div class="capa-fig">${boneca("alegria")}</div>`;
}
let antesAdulto = null;
function abreAdulto(){
  pausaCena();
  antesAdulto = {nome:S.nome, vestido:S.vestido, pele:S.pele, cabelo:S.cabelo};
  montaAdulto();
  $("#ov-adulto").classList.add("on");
  $("#folha-adulto").scrollTop = 0;
}
function fechaAdulto(salvou){
  $("#ov-adulto").classList.remove("on");
  calar();
  /* fechou sem salvar: nome e cores voltam ao que eram */
  if(!salvou && antesAdulto) Object.assign(S, antesAdulto);
  antesAdulto = null;
  if(veioDoIndex){ location.replace(MENU); return; }
  desenhaCapa();
  if($("#t-mapa").classList.contains("on")) montaMapa();
  retomar();                               // redesenha a cena com o nome e as cores novas
}

montaTrilha(); montaArcoiris();
$("#uni").innerHTML = unicornio();
desenhaCapa();
tela("inicio");
if(S.prog.some(p=>p>0)) $("#sub-inicio").textContent = "Seu arco-íris está esperando por você.";
if(location.hash === "#mapa"){ audio(); setTimeout(irMapa, 60); }
else if(veioDoIndex){ abreAdulto(); }

$("#btJogar").addEventListener("click", ()=>{
  audio(); SFX.brilho();
  irMapa();
});
$("#btCasa").addEventListener("click", ()=>{
  SFX.toque();
  /* sobe um nível: dentro de uma etapa volta ao mapa; do mapa e da capa vai para o menu de jogos */
  if($("#t-mapa").classList.contains("on") || $("#t-inicio").classList.contains("on")){
    pausaCena();
    location.href = MENU;
  } else irMapa();
});
$("#btRepetir").addEventListener("click", ()=>{
  if(falaViva) return;                     // já está falando: não recomeça por cima
  if($("#ov-respiro").classList.contains("on")){ if(ultimaFala) falar(ultimaFala); return; }
  if(repete) repete();
  else if(ultimaFala) falar(ultimaFala);
});
$("#btFlor").addEventListener("click", ()=>{ audio(); SFX.toque(); abreRespiro(); });

/* portão do adulto: segurar 1,2 s */
let tGate = null;
const btAd = $("#btAdulto");
btAd.addEventListener("pointerdown", ()=>{ clearTimeout(tGate); tGate = setTimeout(abreAdulto, 1200); });
["pointerup","pointerleave","pointercancel"].forEach(ev=>
  btAd.addEventListener(ev, ()=>clearTimeout(tGate)));
btAd.addEventListener("click", ()=>{
  if(!$(".ov.on")) falar("Segure o botãozinho para chamar um adulto.");
});
/* tocar fora da folha fecha */
$("#ov-respiro").addEventListener("click", e=>{ if(e.target === e.currentTarget) fechaRespiro(); });
$("#ov-adulto").addEventListener("click", e=>{ if(e.target === e.currentTarget) fechaAdulto(false); });

/* saiu do app (tela apagou, trocou de aplicativo): pausa; voltou: retoma a cena */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    if($("#ov-respiro").classList.contains("on")) fechaRespiro();
    pausaCena();
  } else retomar();
});
/* segurar o dedo (engrenagem, flor) não pode abrir o menu do Android */
addEventListener("contextmenu", e=>{ if(!e.target.closest("input,textarea")) e.preventDefault(); });
/* sem zoom por pinça nem por dois toques (Safari ignora o user-scalable) */
["gesturestart","gesturechange"].forEach(ev=>addEventListener(ev, e=>e.preventDefault()));
})();
</script>
</body>
</html>
